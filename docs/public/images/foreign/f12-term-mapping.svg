<svg xmlns="http://www.w3.org/2000/svg" width="940" height="572" viewBox="0 0 940 572" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="572" fill="#eef1f5"/><text x="28" y="36" font-size="17" fill="#1f2329" font-weight="700" text-anchor="start">从中文议题到英文检索词的对照路径</text><text x="28" y="58" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">不要直接翻译题目，要从已有文献里“捡”英文表达</text><rect x="28" y="80" width="300" height="226" fill="#e8f2ff" rx="10"/><text x="178" y="112" font-size="14" fill="#1677ff" font-weight="700" text-anchor="middle">中文议题</text><rect x="52" y="130" width="252" height="26" fill="#ffffff" rx="5" stroke="#b6d4fb" stroke-width="1"/><text x="178" y="148" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">研发费用加计扣除</text><rect x="52" y="164" width="252" height="26" fill="#ffffff" rx="5" stroke="#b6d4fb" stroke-width="1"/><text x="178" y="182" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">税收优惠</text><rect x="52" y="198" width="252" height="26" fill="#ffffff" rx="5" stroke="#b6d4fb" stroke-width="1"/><text x="178" y="216" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">企业创新投入</text><rect x="52" y="232" width="252" height="26" fill="#ffffff" rx="5" stroke="#b6d4fb" stroke-width="1"/><text x="178" y="250" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">税负转嫁</text><rect x="52" y="266" width="252" height="26" fill="#ffffff" rx="5" stroke="#b6d4fb" stroke-width="1"/><text x="178" y="284" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">税收征管效率</text><line x1="340" y1="144" x2="400" y2="144" stroke="#fa8c16" stroke-width="1.8"/><path d="M 400.0 144.0 L 391.0 139.4 L 391.0 148.6 Z" fill="#fa8c16"/><text x="370" y="138" font-size="10.5" fill="#8a6100" font-weight="400" text-anchor="middle">① 读中文论文的英文摘要</text><line x1="340" y1="196" x2="400" y2="196" stroke="#fa8c16" stroke-width="1.8"/><path d="M 400.0 196.0 L 391.0 191.4 L 391.0 200.6 Z" fill="#fa8c16"/><text x="370" y="190" font-size="10.5" fill="#8a6100" font-weight="400" text-anchor="middle">② 看知网外文文献题录</text><line x1="340" y1="248" x2="400" y2="248" stroke="#fa8c16" stroke-width="1.8"/><path d="M 400.0 248.0 L 391.0 243.4 L 391.0 252.6 Z" fill="#fa8c16"/><text x="370" y="242" font-size="10.5" fill="#8a6100" font-weight="400" text-anchor="middle">③ 查政策文件官方英译</text><line x1="340" y1="300" x2="400" y2="300" stroke="#fa8c16" stroke-width="1.8"/><path d="M 400.0 300.0 L 391.0 295.4 L 391.0 304.6 Z" fill="#fa8c16"/><text x="370" y="294" font-size="10.5" fill="#8a6100" font-weight="400" text-anchor="middle">④ 用词典 + 回验</text><rect x="410" y="80" width="502" height="226" fill="#eaf7ee" rx="10"/><text x="661" y="112" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle">英文检索词与同义表达</text><rect x="432" y="130" width="458" height="26" fill="#ffffff" rx="5" stroke="#bfe3cb" stroke-width="1"/><text x="448" y="148" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">R&amp;D tax credit / super deduction</text><text x="874" y="148" font-size="10.5" fill="#16a34a" font-weight="400" text-anchor="end">同义 ✓</text><rect x="432" y="164" width="458" height="26" fill="#ffffff" rx="5" stroke="#bfe3cb" stroke-width="1"/><text x="448" y="182" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">tax incentive / tax preference</text><text x="874" y="182" font-size="10.5" fill="#16a34a" font-weight="400" text-anchor="end">同义 ✓</text><rect x="432" y="198" width="458" height="26" fill="#ffffff" rx="5" stroke="#bfe3cb" stroke-width="1"/><text x="448" y="216" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">firm innovation / R&amp;D investment</text><text x="874" y="216" font-size="10.5" fill="#16a34a" font-weight="400" text-anchor="end">同义 ✓</text><rect x="432" y="232" width="458" height="26" fill="#ffffff" rx="5" stroke="#bfe3cb" stroke-width="1"/><text x="448" y="250" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">tax shifting / tax incidence</text><text x="874" y="250" font-size="10.5" fill="#16a34a" font-weight="400" text-anchor="end">同义 ✓</text><rect x="432" y="266" width="458" height="26" fill="#ffffff" rx="5" stroke="#bfe3cb" stroke-width="1"/><text x="448" y="284" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">tax administration efficiency</text><text x="874" y="284" font-size="10.5" fill="#16a34a" font-weight="400" text-anchor="end">同义 ✓</text><rect x="28" y="322" width="884" height="62" fill="#fffbe6" rx="8" stroke="#ffe58f" stroke-width="1"/><text x="48" y="346" font-size="12" fill="#8a6100" font-weight="400" text-anchor="start">回验方法：把想用的英文词放回英文数据库里搜一遍。如果搜索结果的标题和摘要里几乎不出现这个词，</text><text x="48" y="366" font-size="12" fill="#8a6100" font-weight="400" text-anchor="start">说明它不是学术界的常用说法，应当换词；这是判断译法是否地道的唯一可靠办法。</text><rect x="28" y="396" width="884" height="140" fill="#ffffff" rx="6" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="396" width="884" height="28" fill="#e9edf2"/><text x="38" y="414.14" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">常见误区</text><text x="318" y="414.14" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">后果</text><text x="558" y="414.14" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">正确做法</text><text x="38" y="442.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">把整句中文题目翻译成英文去搜</text><text x="318" y="442.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">结果数为 0 或极少</text><text x="558" y="442.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">拆成概念块，每个块找 1—3 个英文表达</text><line x1="28" y1="424" x2="912" y2="424" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="452" width="884" height="28" fill="#f5f7fa"/><text x="38" y="470.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">只搜缩写（R&amp;D、VAT）</text><text x="318" y="470.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">漏掉全称写法的文献</text><text x="558" y="470.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">缩写与全称都要检索，用 OR 连接</text><line x1="28" y1="452" x2="912" y2="452" stroke="#e8ecf1" stroke-width="1"/><text x="38" y="498.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">只用上位词（taxation）</text><text x="318" y="498.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">结果过多、噪声大</text><text x="558" y="498.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">补充核心词与限定条件</text><line x1="28" y1="480" x2="912" y2="480" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="508" width="884" height="28" fill="#f5f7fa"/><text x="38" y="526.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">忽略英式 / 美式拼写差异</text><text x="318" y="526.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">漏掉一部分文献</text><text x="558" y="526.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">两种拼写都要出现在检索式中</text><line x1="28" y1="508" x2="912" y2="508" stroke="#e8ecf1" stroke-width="1"/><text x="928" y="563" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">概念示意图</text></svg>