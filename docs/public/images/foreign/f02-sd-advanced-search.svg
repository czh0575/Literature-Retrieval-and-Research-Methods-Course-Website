="start">Find articles with these terms</text><rect x="48" y="200" width="620" height="30" fill="#ffffff" rx="4" stroke="#d7dce3" stroke-width="1"/><text x="57" y="219.5" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">"R&amp;D tax credit" AND innovat*</text><text x="48" y="250" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">In this journal or book title</text><rect x="48" y="260" width="620" height="28" fill="#ffffff" rx="4" stroke="#d7dce3" stroke-width="1"/><text x="48" y="308" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Author(s)</text><rect x="48" y="318" width="300" height="28" fill="#ffffff" rx="4" stroke="#d7dce3" stroke-width="1"/><text x="366" y="308" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Author affiliation</text><rect x="366" y="318" width="302" height="28" fill="#ffffff" rx="4" stroke="#d7dce3" stroke-width="1"/><text x="48" y="366" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Title, abstract or author-specified keywords</text><rect x="366" y="356" width="302" height="28" fill="#ffffff" rx="4" stroke="#d7dce3" stroke-width="1"/><text x="375" y="374.5" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">R&amp;D tax credit</text><text x="48" y="416" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Years</text><rect x="130" y="404" width="90" height="28" fill="#ffffff" rx="4" stroke="#d7dce3" stroke-width="1"/><text x="139" y="422.5" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">2015</text><text x="230" y="422" font-size="12" fill="#98a1ab" font-weight="400" text-anchor="start">to</text><rect x="256" y="404" width="90" height="28" fill="#ffffff" rx="4" stroke="#d7dce3" stroke-width="1"/><text x="265" y="422.5" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">2026</text><rect x="366" y="404" width="302" height="28" fill="#ffffff" rx="4" stroke="#d7dce3" stroke-width="1"/><text x="375" y="422.5" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">Article type: Review articles ▾</text><rect x="48" y="454" width="110" height="32" fill="#eb6a00" rx="5"/><text x="103" y="475" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">Search</text><rect x="170" y="454" width="130" height="32" fill="#ffffff" rx="5" stroke="#d7dce3" stroke-width="1"/><text x="235" y="475" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="middle">Clear form</text><text x="330" y="475" font-size="12.5" fill="#1677ff" font-weight="400" text-anchor="start">Show more options ▾</text><circle cx="690" cy="215" r="11" fill="#fa8c16"/><text x="690" y="219.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="690" cy="274" r="11" fill="#fa8c16"/><text x="690" y="278.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><circle cx="690" cy="332" r="11" fill="#fa8c16"/><text x="690" y="336.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><circle cx="690" cy="371" r="11" fill="#fa8c16"/><text x="690" y="375.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><circle cx="690" cy="419" r="11" fill="#fa8c16"/><text x="690" y="423.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="48" y="498" width="864" height="81" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="60" y="522" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">① 主检索框：多个概念用 AND 连接，同义词用 OR 并用括号括起　② 按期刊限定：知道自己要投/要引哪本刊时使用</text><text x="60" y="541" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">③ 作者与作者单位：追踪某位学者或某个研究机构　④ 字段限定：Title, abstract or author-specified keywords 相当于知网的“主题”</text><text x="60" y="560" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">⑤ 时间范围与文献类型：先不加，结果太多时再加</text><text x="948" y="591" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>