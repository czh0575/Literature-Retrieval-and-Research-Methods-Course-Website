<svg xmlns="http://www.w3.org/2000/svg" width="940" height="548" viewBox="0 0 940 548" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="548" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">JCR 分区与影响因子怎么读</text><text x="28" y="56" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">关键点：分区是“同一学科类别内部”的相对位置，不是全学科统一分数线</text><rect x="28" y="74" width="884" height="168" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="48" y="102" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">某一学科类别（例如 Economics）内的期刊排名（示意）</text><rect x="48" y="122" width="211.0" height="46" fill="#16a34a" opacity="0.18"/><rect x="48" y="122" width="211.0" height="46" fill="none" stroke="#16a34a" stroke-width="1.4"/><text x="153.5" y="144" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle">Q1</text><text x="153.5" y="161" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="middle">第 1—25%</text><rect x="259.0" y="122" width="211.0" height="46" fill="#1677ff" opacity="0.18"/><rect x="259.0" y="122" width="211.0" height="46" fill="none" stroke="#1677ff" stroke-width="1.4"/><text x="364.5" y="144" font-size="15" fill="#1677ff" font-weight="700" text-anchor="middle">Q2</text><text x="364.5" y="161" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="middle">第 25—50%</text><rect x="470.0" y="122" width="211.0" height="46" fill="#fa8c16" opacity="0.18"/><rect x="470.0" y="122" width="211.0" height="46" fill="none" stroke="#fa8c16" stroke-width="1.4"/><text x="575.5" y="144" font-size="15" fill="#fa8c16" font-weight="700" text-anchor="middle">Q3</text><text x="575.5" y="161" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="middle">第 50—75%</text><rect x="681.0" y="122" width="211.0" height="46" fill="#d93a3a" opacity="0.18"/><rect x="681.0" y="122" width="211.0" height="46" fill="none" stroke="#d93a3a" stroke-width="1.4"/><text x="786.5" y="144" font-size="15" fill="#d93a3a" font-weight="700" text-anchor="middle">Q4</text><text x="786.5" y="161" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="middle">第 75—100%</text><text x="48" y="190" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">排名靠前（指标高）</text><text x="892" y="190" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="end">排名靠后（指标低）</text><text x="48" y="214" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Journal Impact Factor (JIF)：某刊前两年论文在统计年的平均被引次数，衡量的是“期刊”而非“某篇论文”。</text><rect x="28" y="262" width="884" height="168" fill="#ffffff" rx="6" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="262" width="884" height="28" fill="#e9edf2"/><text x="38" y="280.14" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">指标</text><text x="278" y="280.14" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">含义</text><text x="578" y="280.14" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">使用时的注意点</text><text x="38" y="308.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Journal Impact Factor (JIF)</text><text x="278" y="308.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">该刊近年论文的平均被引水平</text><text x="578" y="308.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">只看期刊整体，不能评价单篇文献</text><line x1="28" y1="290" x2="912" y2="290" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="318" width="884" height="28" fill="#f5f7fa"/><text x="38" y="336.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">JIF Quartile（Q1—Q4）</text><text x="278" y="336.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">同一学科类别内按 JIF 四等分</text><text x="578" y="336.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">必须同时说明“哪个类别里的 Q1”</text><line x1="28" y1="318" x2="912" y2="318" stroke="#e8ecf1" stroke-width="1"/><text x="38" y="364.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">JIF Rank / Percentile</text><text x="278" y="364.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">该刊在类别内的排名与百分位</text><text x="578" y="364.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">跨学科比较时不可直接用 JIF</text><line x1="28" y1="346" x2="912" y2="346" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="374" width="884" height="28" fill="#f5f7fa"/><text x="38" y="392.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">JCI</text><text x="278" y="392.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">按类别归一化后的引文指标</text><text x="578" y="392.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">适合跨学科横向比较</text><line x1="28" y1="374" x2="912" y2="374" stroke="#e8ecf1" stroke-width="1"/><text x="38" y="420.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Category</text><text x="278" y="420.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">该刊所属的学科类别（可多个）</text><text x="578" y="420.14" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">不同类别里分区可能不同</text><line x1="28" y1="402" x2="912" y2="402" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="456" width="884" height="62" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="40" y="480" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· JCR 分区与中科院分区是两套体系，发布方、分类方法与使用习惯都不同，写论文或申报前先问清学院要求哪一种。</text><text x="40" y="499" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start"></text><text x="928" y="539" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">概念示意图，未标注具体数值</text></svg>