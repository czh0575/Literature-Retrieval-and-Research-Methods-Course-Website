n:</text><circle cx="126" cy="294" r="6" fill="#ffffff" stroke="#1677ff" stroke-width="1.4"/><circle cx="126" cy="294" r="2.88" fill="#1677ff"/><text x="140" y="298" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">All years (1990 - 2026)</text><circle cx="294" cy="294" r="6" fill="#ffffff" stroke="#d7dce3" stroke-width="1.4"/><text x="308" y="298" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Since 2020</text><circle cx="462" cy="294" r="6" fill="#ffffff" stroke="#d7dce3" stroke-width="1.4"/><text x="476" y="298" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Custom year range</text><rect x="46" y="322" width="868" height="96" fill="#fafbfd" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="64" y="348" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">常用检索字段（下拉列表）</text><text x="64" y="374" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· Topic (TS=)</text><text x="280" y="374" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· Title (TI=)</text><text x="496" y="374" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· Author (AU=)</text><text x="712" y="374" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· Publication Titles (SO=)</text><text x="64" y="396" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· Year Published (PY=)</text><text x="280" y="396" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· Affiliation (OG=)</text><text x="496" y="396" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· DOI</text><circle cx="38" cy="270" r="11" fill="#fa8c16"/><text x="38" y="274.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="38" cy="186" r="11" fill="#fa8c16"/><text x="38" y="190.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><circle cx="698" cy="186" r="11" fill="#fa8c16"/><text x="698" y="190.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><circle cx="38" cy="294" r="11" fill="#fa8c16"/><text x="38" y="298.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="46" y="434" width="868" height="81" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="58" y="458" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">① 检索行与字段：Topic 字段（TS=）覆盖标题、摘要、作者关键词与 Keywords Plus，是最常用的求全字段</text><text x="58" y="477" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">② 字段下拉：需要精确时改用 Title / Author / Publication Titles　③ 检索框：AND / OR / NOT 必须大写，精确短语用 " "</text><text x="58" y="496" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">④ 时间范围：先用 All years，结果太多再收窄</text><text x="948" y="513" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>