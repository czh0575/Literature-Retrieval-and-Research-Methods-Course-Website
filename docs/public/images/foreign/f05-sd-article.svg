<svg xmlns="http://www.w3.org/2000/svg" width="960" height="592" viewBox="0 0 960 592" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="960" height="592" fill="#eef1f5"/><rect x="32" y="28" width="900" height="510" fill="#cbd3dd" rx="9" opacity="0.55"/><rect x="30" y="24" width="900" height="510" fill="#ffffff" rx="9" stroke="#d7dce3" stroke-width="1"/><rect x="30" y="24" width="900" height="26" fill="#f1f3f6" rx="9"/><rect x="30" y="40" width="900" height="20" fill="#f1f3f6"/><rect x="42" y="30" width="190" height="24" fill="#ffffff" rx="6"/><text x="54" y="46" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Article</text><circle cx="206" cy="42" r="4" fill="none"/><circle cx="206" cy="42" r="4" fill="none"/><circle cx="206" cy="42" r="4" fill="none"/><rect x="240" y="36" width="22" height="14" fill="none" rx="2" stroke="#98a1ab" stroke-width="1"/><rect x="42" y="60" width="876" height="20" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="52" y="66" width="8" height="8" fill="none" rx="2" stroke="#16a34a" stroke-width="1.2"/><text x="68" y="74" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">https://www.sciencedirect.com/science/article/pii/S0048...</text><rect x="870" y="62" width="14" height="14" fill="none"/><line x1="30" y1="86" x2="930" y2="86" stroke="#d7dce3" stroke-width="1"/><rect x="30" y="86" width="900" height="32" fill="#f7f9fb"/><line x1="30" y1="118" x2="930" y2="118" stroke="#e8ecf1" stroke-width="1"/><rect x="46" y="94" width="4" height="18" fill="#eb6a00" rx="2"/><text x="58" y="108" font-size="14" fill="#eb6a00" font-weight="700" text-anchor="start">ScienceDirect</text><text x="54" y="152" font-size="15" fill="#1f2329" font-weight="700" text-anchor="start">R&amp;D tax credits and firm innovation: Evidence from a</text><text x="54" y="174" font-size="15" fill="#1f2329" font-weight="700" text-anchor="start">quasi-natural experiment</text><text x="54" y="198" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">J. Smith a, L. Wang b, M. Rossi c</text><text x="54" y="218" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">Research Policy · Volume 53, Issue 3 · April 2024 · Pages 104-126</text><rect x="670" y="142" width="108" height="30" fill="#eb6a00" rx="5"/><text x="724" y="162" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Download PDF</text><rect x="786" y="142" width="108" height="30" fill="#ffffff" rx="5" stroke="#d7dce3" stroke-width="1"/><text x="840" y="162" font-size="11" fill="#5b6470" font-weight="400" text-anchor="middle">Cite  ▾</text><line x1="54" y1="234" x2="894" y2="234" stroke="#e8ecf1" stroke-width="1"/><text x="54" y="262" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">Highlights</text><text x="66" y="284" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">· R&amp;D tax credits increase patent counts by 8%</text><text x="66" y="304" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">· Effects are concentrated in financially constrained firms</text><text x="66" y="324" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">· No evidence of crowding out of private R&amp;D</text><text x="66" y="344" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">· Policy design matters more than credit generosity</text><text x="54" y="386" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">Abstract</text><text x="54" y="408" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">We exploit a reform that expanded R&amp;D tax credits to identify the causal</text><text x="54" y="425" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">effect of fiscal incentives on firm innovation. Using firm-level panel data,</text><text x="54" y="442" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">we find that eligible firms increased R&amp;D expenditure and patent filings.</text><text x="54" y="474" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">Keywords</text><rect x="54" y="484" width="98.32000000000001" height="20" fill="#fff2e6" rx="11"/><text x="103.16" y="497.78" font-size="10.5" fill="#8a4200" font-weight="400" text-anchor="middle">R&amp;D tax credit</text><rect x="159.32" y="484" width="74.80000000000001" height="20" fill="#fff2e6" rx="11"/><text x="196.72" y="497.78" font-size="10.5" fill="#8a4200" font-weight="400" text-anchor="middle">Innovation</text><rect x="241.12" y="484" width="92.44000000000001" height="20" fill="#fff2e6" rx="11"/><text x="287.34000000000003" y="497.78" font-size="10.5" fill="#8a4200" font-weight="400" text-anchor="middle">Tax incentive</text><rect x="340.56" y="484" width="98.32000000000001" height="20" fill="#fff2e6" rx="11"/><text x="389.72" y="497.78" font-size="10.5" fill="#8a4200" font-weight="400" text-anchor="middle">Firm behaviour</text><text x="54" y="530" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">Introduction</text><text x="54" y="550" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">1.1 Background ........................................................................</text><text x="54" y="570" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">1.2 Contribution ......................................................................</text><rect x="678" y="254" width="216" height="210" fill="#fafbfd" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="694" y="278" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">More info</text><text x="694" y="304" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">Cited by</text><text x="878" y="304" font-size="11" fill="#1677ff" font-weight="400" text-anchor="end">42</text><text x="694" y="330" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">Related articles</text><text x="878" y="330" font-size="11" fill="#1677ff" font-weight="400" text-anchor="end">12</text><text x="694" y="356" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">Recommended</text><text x="878" y="356" font-size="11" fill="#1677ff" font-weight="400" text-anchor="end">10</text><text x="694" y="382" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">Cited by (Scopus)</text><text x="878" y="382" font-size="11" fill="#1677ff" font-weight="400" text-anchor="end">38</text><line x1="694" y1="414" x2="878" y2="414" stroke="#e8ecf1" stroke-width="1"/><text x="694" y="436" font-size="11" fill="#1677ff" font-weight="400" text-anchor="start">Save to list / Set alert</text><circle cx="38" cy="260" r="11" fill="#fa8c16"/><text x="38" y="264.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="38" cy="384" r="11" fill="#fa8c16"/><text x="38" y="388.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><circle cx="38" cy="472" r="11" fill="#fa8c16"/><text x="38" y="476.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><circle cx="662" cy="160" r="11" fill="#fa8c16"/><text x="662" y="164.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><circle cx="662" cy="276" r="11" fill="#fa8c16"/><text x="662" y="280.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><circle cx="38" cy="528" r="11" fill="#fa8c16"/><text x="38" y="532.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="948" y="583" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>