<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="960" height="470" fill="#eef1f5"/><rect x="40" y="40" width="424" height="316" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="40" y="40" width="424" height="52" fill="#1677ff" rx="10" opacity="0.12"/><text x="60" y="74" font-size="14" fill="#1677ff" font-weight="700" text-anchor="start">题目形如：X 对 Y 的影响</text><text x="62" y="106" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">① 两头分：X 的经济后果 + Y 的影响因素</text><text x="62" y="130" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">② 加一节机制：把两头接起来</text><text x="62" y="154" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">③ 具体问题具体分析</text><text x="62" y="178" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">· 新范畴 → 先梳理定义与度量</text><text x="62" y="202" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">· 机理不同 → 专设影响机制一节</text><text x="62" y="226" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">· 属某支大类文献 → 先总括再收窄</text><text x="62" y="250" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">④ 上位概念切入：先抬后收</text><text x="62" y="274" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">⑤ 末节固定为文献评述</text><rect x="496" y="40" width="424" height="316" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="496" y="40" width="424" height="52" fill="#fa8c16" rx="10" opacity="0.14"/><text x="516" y="74" font-size="14" fill="#fa8c16" font-weight="700" text-anchor="start">题目形如：某问题 / 对策研究</text><text x="518" y="106" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">① 由大到小，逐层收缩</text><text x="518" y="137" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">· 税收风险管理的相关研究</text><text x="518" y="168" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">· A 行业税收风险管理的相关研究</text><text x="518" y="199" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">· 增值税税收风险管理的相关研究</text><text x="518" y="230" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">② 或按研究视角切分</text><text x="518" y="261" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">· 可行性研究　· 态度与动机研究</text><text x="518" y="292" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">· 效应研究</text><text x="518" y="323" font-size="12.5" fill="#1f2329" font-weight="400" text-anchor="start">③ 末节固定为文献评述</text><rect x="40" y="376" width="880" height="62" fill="#fffbe6" rx="10" stroke="#ffe58f" stroke-width="1"/><text x="60" y="402" font-size="13" fill="#8a6100" font-weight="700" text-anchor="start">两条共同要求</text><text x="60" y="426" font-size="12.5" fill="#8a6100" font-weight="400" text-anchor="start">① 题目里每加一个限定词，综述就多收缩一层；② 每个专题的结尾都要收束到同一个研究缺口。</text><text x="948" y="461" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">概念示意图（讲义配图）</text></svg>