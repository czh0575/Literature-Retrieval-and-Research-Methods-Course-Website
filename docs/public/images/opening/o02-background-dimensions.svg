<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="960" height="500" fill="#eef1f5"/><text x="480" y="42" font-size="14" fill="#1f2329" font-weight="700" text-anchor="middle">研究背景的三个维度：国家有政策、社会有需要、学界有需求</text><rect x="56" y="74" width="260" height="152" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="56" y="74" width="260" height="6" fill="#1677ff" rx="3"/><circle cx="90" cy="114" r="15" fill="#1677ff" opacity="0.14"/><text x="90" y="118.5" font-size="12" fill="#1677ff" font-weight="700" text-anchor="middle">Ⅰ</text><text x="114" y="119" font-size="15" fill="#1677ff" font-weight="700" text-anchor="start">国家政策</text><circle cx="80" cy="156" r="2.4" fill="#1677ff"/><text x="92" y="160" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">相关改革与制度变化</text><circle cx="80" cy="180" r="2.4" fill="#1677ff"/><text x="92" y="184" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">呈现政策演变脉络</text><circle cx="80" cy="204" r="2.4" fill="#1677ff"/><text x="92" y="208" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">适当引用，不堆砌口号</text><rect x="350" y="74" width="260" height="152" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="350" y="74" width="260" height="6" fill="#fa8c16" rx="3"/><circle cx="384" cy="114" r="15" fill="#fa8c16" opacity="0.14"/><text x="384" y="118.5" font-size="12" fill="#fa8c16" font-weight="700" text-anchor="middle">Ⅱ</text><text x="408" y="119" font-size="15" fill="#fa8c16" font-weight="700" text-anchor="start">社会需要</text><circle cx="374" cy="156" r="2.4" fill="#fa8c16"/><text x="386" y="160" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">当下突出的现实问题</text><circle cx="374" cy="180" r="2.4" fill="#fa8c16"/><text x="386" y="184" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">谁受到影响</text><circle cx="374" cy="204" r="2.4" fill="#fa8c16"/><text x="386" y="208" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">用数据与材料支撑</text><rect x="644" y="74" width="260" height="152" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="644" y="74" width="260" height="6" fill="#7c3aed" rx="3"/><circle cx="678" cy="114" r="15" fill="#7c3aed" opacity="0.14"/><text x="678" y="118.5" font-size="12" fill="#7c3aed" font-weight="700" text-anchor="middle">Ⅲ</text><text x="702" y="119" font-size="15" fill="#7c3aed" font-weight="700" text-anchor="start">学界需求</text><circle cx="668" cy="156" r="2.4" fill="#7c3aed"/><text x="680" y="160" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">研究尚不充分之处</text><circle cx="668" cy="180" r="2.4" fill="#7c3aed"/><text x="680" y="184" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">已有结论的分歧</text><circle cx="668" cy="204" r="2.4" fill="#7c3aed"/><text x="680" y="208" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">由此引出研究缺口</text><line x1="186" y1="228" x2="480" y2="286" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 480.0 286.0 L 472.1 279.7 L 470.3 288.8 Z" fill="#c3c9d1"/><line x1="480" y1="228" x2="480" y2="286" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 480.0 286.0 L 484.6 277.0 L 475.4 277.0 Z" fill="#c3c9d1"/><line x1="774" y1="228" x2="480" y2="286" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 480.0 286.0 L 489.7 288.8 L 487.9 279.7 Z" fill="#c3c9d1"/><rect x="300" y="288" width="360" height="56" fill="#f4f8ff" rx="10" stroke="#c9defb" stroke-width="1"/><text x="480" y="322" font-size="13.5" fill="#1677ff" font-weight="700" text-anchor="middle">研究背景：三条线索汇入同一处</text><line x1="480" y1="344" x2="480" y2="374" stroke="#fa8c16" stroke-width="2"/><path d="M 480.0 374.0 L 484.6 365.0 L 475.4 365.0 Z" fill="#fa8c16"/><rect x="280" y="376" width="400" height="52" fill="#fff6e8" rx="10" stroke="#ffd591" stroke-width="1"/><text x="480" y="408" font-size="13.5" fill="#b45309" font-weight="700" text-anchor="middle">推导出本文最核心的研究内容</text><text x="948" y="491" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">概念示意图（讲义配图）</text></svg>