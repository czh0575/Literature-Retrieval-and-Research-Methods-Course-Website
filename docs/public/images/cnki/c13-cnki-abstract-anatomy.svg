<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="480" fill="#eef1f5"/><text x="28" y="36" font-size="17" fill="#1f2329" font-weight="700" text-anchor="start">摘要的五要素：把一段话拆成五类信息</text><text x="28" y="58" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">读摘要的目标不是“读懂”，而是“判断它能不能用在我的哪一部分”</text><rect x="28" y="80" width="884" height="176" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><rect x="48" y="96" width="520" height="26" fill="#1677ff" rx="4" opacity="0.09"/><rect x="48" y="96" width="4" height="26" fill="#1677ff" rx="2"/><text x="62" y="114" font-size="12" fill="#1f2329" font-weight="400" text-anchor="start">本文以 2015 年研发费用加计扣除政策扩围为准自然实验，</text><line x1="578" y1="109" x2="596" y2="109" stroke="#1677ff" stroke-width="1.4"/><text x="604" y="114" font-size="11.5" fill="#1677ff" font-weight="700" text-anchor="start">研究问题 / 情境</text><rect x="48" y="126" width="520" height="26" fill="#1677ff" rx="4" opacity="0.09"/><rect x="48" y="126" width="4" height="26" fill="#1677ff" rx="2"/><text x="62" y="144" font-size="12" fill="#1f2329" font-weight="400" text-anchor="start">选取 2012—2020 年 A 股上市公司为样本，采用双重差分模型检验税收优惠对企业研发投入的影响，</text><line x1="578" y1="139" x2="596" y2="139" stroke="#1677ff" stroke-width="1.4"/><text x="604" y="144" font-size="11.5" fill="#1677ff" font-weight="700" text-anchor="start">数据与样本</text><rect x="48" y="156" width="520" height="26" fill="#16a34a" rx="4" opacity="0.09"/><rect x="48" y="156" width="4" height="26" fill="#16a34a" rx="2"/><text x="62" y="174" font-size="12" fill="#1f2329" font-weight="400" text-anchor="start">并检验融资约束的中介作用。研究发现：加计扣除政策显著提高了处理组企业的研发投入强度，</text><line x1="578" y1="169" x2="596" y2="169" stroke="#16a34a" stroke-width="1.4"/><text x="604" y="174" font-size="11.5" fill="#16a34a" font-weight="700" text-anchor="start">研究方法</text><rect x="48" y="186" width="520" height="26" fill="#fa8c16" rx="4" opacity="0.09"/><rect x="48" y="186" width="4" height="26" fill="#fa8c16" rx="2"/><text x="62" y="204" font-size="12" fill="#1f2329" font-weight="400" text-anchor="start">且这一效应在中小企业中更为明显；政策通过缓解融资约束提升企业研发意愿。</text><line x1="578" y1="199" x2="596" y2="199" stroke="#fa8c16" stroke-width="1.4"/><text x="604" y="204" font-size="11.5" fill="#fa8c16" font-weight="700" text-anchor="start">主要结论</text><rect x="48" y="216" width="520" height="26" fill="#7c3aed" rx="4" opacity="0.09"/><rect x="48" y="216" width="4" height="26" fill="#7c3aed" rx="2"/><text x="62" y="234" font-size="12" fill="#1f2329" font-weight="400" text-anchor="start">研究结论对完善研发费用加计扣除政策具有参考意义。</text><line x1="578" y1="229" x2="596" y2="229" stroke="#7c3aed" stroke-width="1.4"/><text x="604" y="234" font-size="11.5" fill="#7c3aed" font-weight="700" text-anchor="start">政策含义</text><rect x="28" y="268" width="884" height="56" fill="#fffbe6" rx="8" stroke="#ffe58f" stroke-width="1"/><text x="48" y="292" font-size="12" fill="#8a6100" font-weight="400" text-anchor="start">读完摘要要能立刻回答三个问题：它研究的是不是我的研究对象？它的结论能支撑我的哪个论点？</text><text x="48" y="312" font-size="12" fill="#8a6100" font-weight="400" text-anchor="start">如果三个问题有两个答不上来，就不必下载全文，只需留下题录备查。</text><rect x="28" y="340" width="884" height="144" fill="#ffffff" rx="6" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="340" width="884" height="24" fill="#e9edf2"/><text x="38" y="356.32" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">摘要里的信息</text><text x="208" y="356.32" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">提取后填到哪里</text><text x="538" y="356.32" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">典型判断</text><text x="38" y="380.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">研究问题 / 情境</text><text x="208" y="380.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">文献综述的“研究背景”段落</text><text x="538" y="380.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">与我选题在同一政策背景下 → 背景相关</text><line x1="28" y1="364" x2="912" y2="364" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="388" width="884" height="24" fill="#f5f7fa"/><text x="38" y="404.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">数据与样本</text><text x="208" y="404.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">研究设计部分的样本说明</text><text x="538" y="404.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">样本年份、行业与我一致 → 可作对照</text><line x1="28" y1="388" x2="912" y2="388" stroke="#e8ecf1" stroke-width="1"/><text x="38" y="428.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">研究方法</text><text x="208" y="428.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">研究方法部分的可行性依据</text><text x="538" y="428.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">方法我学得会 → 收入方法库</text><line x1="28" y1="412" x2="912" y2="412" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="436" width="884" height="24" fill="#f5f7fa"/><text x="38" y="452.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">主要结论</text><text x="208" y="452.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">文献综述的“已有研究结论”</text><text x="538" y="452.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">结论与我预期一致或相反 → 需重点讨论</text><line x1="28" y1="436" x2="912" y2="436" stroke="#e8ecf1" stroke-width="1"/><text x="38" y="476.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">政策含义</text><text x="208" y="476.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">对策建议部分的依据</text><text x="538" y="476.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">可直接引申到我的政策建议 → 有价值</text><line x1="28" y1="460" x2="912" y2="460" stroke="#e8ecf1" stroke-width="1"/><text x="928" y="471" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">概念示意图</text></svg>