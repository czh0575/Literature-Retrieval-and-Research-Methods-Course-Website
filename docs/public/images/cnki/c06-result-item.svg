<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="380" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">一条检索结果上能读到的信息</text><rect x="28" y="52" width="884" height="210" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><rect x="46" y="70" width="14" height="14" fill="#1677ff" rx="2.5" stroke="#1677ff" stroke-width="1"/><path d="M 49.5 77.3 l 3.1 3.4 l 4.8 -5.9" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><text x="72" y="82" font-size="15" fill="#1677ff" font-weight="500" text-anchor="start">研发费用加计扣除政策与企业创新投入——基于双重差分法的经验证据</text><text x="72" y="108" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">张伟, 李娜, 王强</text><text x="200" y="108" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">（浙江越秀外国语学院 国际商学院）</text><text x="72" y="130" font-size="12.5" fill="#1677ff" font-weight="400" text-anchor="start">税务研究</text><text x="133" y="130" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">，2023, (05): 12-20</text><rect x="72" y="142" width="54.0" height="17" fill="#fff6e8" rx="3"/><text x="99.0" y="154.28" font-size="10.5" fill="#fa8c16" font-weight="500" text-anchor="middle">北大核心</text><rect x="132.0" y="142" width="41.400000000000006" height="17" fill="#fff6e8" rx="3"/><text x="152.7" y="154.28" font-size="10.5" fill="#fa8c16" font-weight="500" text-anchor="middle">CSSCI</text><rect x="179.4" y="142" width="56.52" height="17" fill="#fff6e8" rx="3"/><text x="207.66" y="154.28" font-size="10.5" fill="#fa8c16" font-weight="500" text-anchor="middle">AMI 核心</text><text x="72" y="184" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">被引 34　下载 2,105　参考文献 42 篇　基金：国家社会科学基金项目</text><text x="72" y="208" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">摘要：本文以 2015 年研发费用加计扣除政策扩围为准自然实验，基于 A 股高新技术企业</text><text x="72" y="226" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">面板数据，采用双重差分法检验政策对企业创新投入的影响及融资约束的中介机制……</text><circle cx="838" cy="74" r="9" fill="#ffffff" stroke="#e8ecf1" stroke-width="1"/><text x="838" y="78" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="middle">☆</text><circle cx="838" cy="100" r="9" fill="#ffffff" stroke="#e8ecf1" stroke-width="1"/><text x="838" y="104" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="middle">❝</text><circle cx="838" cy="126" r="9" fill="#ffffff" stroke="#e8ecf1" stroke-width="1"/><text x="838" y="130" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="middle">⤓</text><circle cx="838" cy="152" r="9" fill="#ffffff" stroke="#e8ecf1" stroke-width="1"/><text x="838" y="156" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="middle">✦</text><text x="28" y="288" font-size="12.5" fill="#fa8c16" font-weight="700" text-anchor="start">①</text><text x="50" y="288" font-size="12" fill="#1f2329" font-weight="500" text-anchor="start">题名（蓝色可点击）</text><text x="248" y="288" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">→ 判断研究主题与研究方法</text><text x="28" y="312" font-size="12.5" fill="#fa8c16" font-weight="700" text-anchor="start">②</text><text x="50" y="312" font-size="12" fill="#1f2329" font-weight="500" text-anchor="start">作者与作者单位</text><text x="248" y="312" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">→ 识别团队、是否同一单位有系列研究</text><text x="28" y="336" font-size="12.5" fill="#fa8c16" font-weight="700" text-anchor="start">③</text><text x="50" y="336" font-size="12" fill="#1f2329" font-weight="500" text-anchor="start">来源期刊与年份卷期页码</text><text x="248" y="336" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">→ 定位期刊层次、整理题录要用的字段</text><text x="28" y="360" font-size="12.5" fill="#fa8c16" font-weight="700" text-anchor="start">④</text><text x="50" y="360" font-size="12" fill="#1f2329" font-weight="500" text-anchor="start">核心期刊标识</text><text x="248" y="360" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">→ 一眼看出是否 CSSCI / 北大核心</text><text x="480" y="288" font-size="12.5" fill="#fa8c16" font-weight="700" text-anchor="start">⑤</text><text x="502" y="288" font-size="12" fill="#1f2329" font-weight="500" text-anchor="start">被引、下载、参考文献数、基金</text><text x="700" y="288" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">→ 辅助判断文献影响力与权威程度</text><text x="480" y="312" font-size="12.5" fill="#fa8c16" font-weight="700" text-anchor="start">⑥</text><text x="502" y="312" font-size="12" fill="#1f2329" font-weight="500" text-anchor="start">摘要预览</text><text x="700" y="312" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">→ 点开后快速判断是否与自己相关</text><text x="480" y="336" font-size="12.5" fill="#fa8c16" font-weight="700" text-anchor="start">⑦</text><text x="502" y="336" font-size="12" fill="#1f2329" font-weight="500" text-anchor="start">收藏 / 引用 / 下载 / 分享按钮</text><text x="700" y="336" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">→ 导出题录、下载全文的入口</text><text x="928" y="371" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>