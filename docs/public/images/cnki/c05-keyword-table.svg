<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="430" fill="#eef1f5"/><text x="28" y="36" font-size="17" fill="#1f2329" font-weight="700" text-anchor="start">关键词表样例</text><text x="28" y="58" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">论文题目：研发费用加计扣除对高新技术企业创新投入的影响</text><rect x="28" y="74" width="884" height="224" fill="#ffffff" rx="6" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="74" width="884" height="32" fill="#e9edf2"/><text x="38" y="94.32" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">概念角色</text><text x="168" y="94.32" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">关键词</text><text x="548" y="94.32" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">来源或依据</text><text x="38" y="126.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">核心政策</text><text x="168" y="126.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">研发费用加计扣除；加计扣除；税收优惠</text><text x="548" y="126.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">论文题目；财税〔2015〕119 号文件</text><line x1="28" y1="106" x2="912" y2="106" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="138" width="884" height="32" fill="#f5f7fa"/><text x="38" y="158.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">研究对象</text><text x="168" y="158.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">高新技术企业；制造业企业；A 股上市公司</text><text x="548" y="158.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">题目；国家统计局行业分类</text><line x1="28" y1="138" x2="912" y2="138" stroke="#e8ecf1" stroke-width="1"/><text x="38" y="190.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">结果变量</text><text x="168" y="190.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">创新投入；研发投入强度；专利申请数</text><text x="548" y="190.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">文献中反复出现的指标</text><line x1="28" y1="170" x2="912" y2="170" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="202" width="884" height="32" fill="#f5f7fa"/><text x="38" y="222.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">机制词</text><text x="168" y="222.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">融资约束；现金流；税负；税收负担</text><text x="548" y="222.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">理论类与综述类文献</text><line x1="28" y1="202" x2="912" y2="202" stroke="#e8ecf1" stroke-width="1"/><text x="38" y="254.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">情境限定</text><text x="168" y="254.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">2015—2024 年；中国；制造业</text><text x="548" y="254.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">数据可得性与政策实施时间</text><line x1="28" y1="234" x2="912" y2="234" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="266" width="884" height="32" fill="#f5f7fa"/><text x="38" y="286.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">同义词（新发现）</text><text x="168" y="286.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">加计扣除比例；研发费用归集；创新绩效</text><text x="548" y="286.32" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">第一轮检索结果的标题与关键词栏</text><line x1="28" y1="266" x2="912" y2="266" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="312" width="884" height="100" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="40" y="336" font-size="12.5" fill="#5b6470" font-weight="700" text-anchor="start">填表要求</text><text x="40" y="355" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 词表控制在 20 个词以内，能组合出 3 组检索式即可开始第一轮检索。</text><text x="40" y="374" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· “来源或依据”一列不能空：写不出来源的词，说明你还没有在任何文献里见过它。</text><text x="40" y="393" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 第一轮检索结束后要把新发现的表达补回本表，词表是活的，不是一次写完。</text><text x="928" y="421" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">表格示意图</text></svg>