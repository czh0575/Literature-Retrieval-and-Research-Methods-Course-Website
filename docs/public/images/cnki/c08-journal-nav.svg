#5b6470" font-weight="400" text-anchor="start">· 影响因子只反映期刊整体被引情况，不能用来评价某一篇论文的质量。</text><text x="40" y="442" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 核实期刊时重点看三件事：收录体系、学科类目、近三年是否还在发同方向的文章。</text><text x="928" y="451" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>