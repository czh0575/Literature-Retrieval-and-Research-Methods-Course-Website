<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="470" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">可视化分析：把一组文献看成一幅地图</text><text x="28" y="56" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">路径：检索结果页 → 可视化分析 → 关键词共现网络 / 文献互引网络 / 年度趋势</text><rect x="28" y="74" width="560" height="300" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="46" y="100" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">关键词共现网络（示意）</text><line x1="300" y1="210" x2="430" y2="150" stroke="#d7dce3" stroke-width="1.4"/><line x1="300" y1="210" x2="180" y2="160" stroke="#d7dce3" stroke-width="1.4"/><line x1="300" y1="210" x2="250" y2="120" stroke="#d7dce3" stroke-width="1.4"/><line x1="300" y1="210" x2="430" y2="260" stroke="#d7dce3" stroke-width="1.4"/><line x1="300" y1="210" x2="170" y2="260" stroke="#d7dce3" stroke-width="1.4"/><line x1="300" y1="210" x2="350" y2="300" stroke="#d7dce3" stroke-width="1.4"/><line x1="300" y1="210" x2="330" y2="90" stroke="#d7dce3" stroke-width="1.4"/><line x1="430" y1="150" x2="430" y2="260" stroke="#d7dce3" stroke-width="1.4"/><line x1="180" y1="160" x2="170" y2="260" stroke="#d7dce3" stroke-width="1.4"/><line x1="250" y1="120" x2="330" y2="90" stroke="#d7dce3" stroke-width="1.4"/><line x1="430" y1="150" x2="330" y2="90" stroke="#d7dce3" stroke-width="1.4"/><circle cx="300" cy="210" r="46" fill="#1677ff" opacity="0.16"/><circle cx="300" cy="210" r="46" fill="none" stroke="#1677ff" stroke-width="1.4"/><text x="300" y="214" font-size="10.5" fill="#1677ff" font-weight="500" text-anchor="middle">研发费用加计扣除</text><circle cx="430" cy="150" r="36" fill="#16a34a" opacity="0.16"/><circle cx="430" cy="150" r="36" fill="none" stroke="#16a34a" stroke-width="1.4"/><text x="430" y="154" font-size="10.5" fill="#16a34a" font-weight="500" text-anchor="middle">企业创新</text><circle cx="180" cy="160" r="30" fill="#fa8c16" opacity="0.16"/><circle cx="180" cy="160" r="30" fill="none" stroke="#fa8c16" stroke-width="1.4"/><text x="180" y="164" font-size="10.5" fill="#fa8c16" font-weight="500" text-anchor="middle">融资约束</text><circle cx="250" cy="120" r="34" fill="#1677ff" opacity="0.16"/><circle cx="250" cy="120" r="34" fill="none" stroke="#1677ff" stroke-width="1.4"/><text x="250" y="124" font-size="10.5" fill="#1677ff" font-weight="500" text-anchor="middle">税收优惠</text><circle cx="430" cy="260" r="28" fill="#16a34a" opacity="0.16"/><circle cx="430" cy="260" r="28" fill="none" stroke="#16a34a" stroke-width="1.4"/><text x="430" y="264" font-size="10.5" fill="#16a34a" font-weight="500" text-anchor="middle">创新绩效</text><circle cx="170" cy="260" r="26" fill="#7c3aed" opacity="0.16"/><circle cx="170" cy="260" r="26" fill="none" stroke="#7c3aed" stroke-width="1.4"/><text x="170" y="264" font-size="10.5" fill="#7c3aed" font-weight="500" text-anchor="middle">中小企业</text><circle cx="350" cy="300" r="24" fill="#fa8c16" opacity="0.16"/><circle cx="350" cy="300" r="24" fill="none" stroke="#fa8c16" stroke-width="1.4"/><text x="350" y="304" font-size="10.5" fill="#fa8c16" font-weight="500" text-anchor="middle">税负</text><circle cx="330" cy="90" r="30" fill="#1677ff" opacity="0.16"/><circle cx="330" cy="90" r="30" fill="none" stroke="#1677ff" stroke-width="1.4"/><text x="330" y="94" font-size="10.5" fill="#1677ff" font-weight="500" text-anchor="middle">高新技术企业</text><rect x="608" y="74" width="304" height="300" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="626" y="100" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">发表年度趋势（示意）</text><line x1="640" y1="330" x2="890" y2="330" stroke="#d7dce3" stroke-width="1"/><line x1="640" y1="330" x2="640" y2="130" stroke="#d7dce3" stroke-width="1"/><rect x="654" y="309.75" width="20" height="20.25" fill="#1677ff" rx="3" opacity="0.85"/><rect x="680" y="300.75" width="20" height="29.25" fill="#1677ff" rx="3" opacity="0.85"/><rect x="706" y="291.75" width="20" height="38.25" fill="#1677ff" rx="3" opacity="0.85"/><rect x="732" y="282.75" width="20" height="47.25" fill="#1677ff" rx="3" opacity="0.85"/><rect x="758" y="264.75" width="20" height="65.25" fill="#1677ff" rx="3" opacity="0.85"/><rect x="784" y="244.5" width="20" height="85.5" fill="#1677ff" rx="3" opacity="0.85"/><rect x="810" y="226.5" width="20" height="103.49999999999999" fill="#1677ff" rx="3" opacity="0.85"/><rect x="836" y="197.25" width="20" height="132.75" fill="#1677ff" rx="3" opacity="0.85"/><rect x="862" y="165.75" width="20" height="164.25" fill="#fa8c16" rx="3" opacity="0.85"/><text x="664" y="346" font-size="9.5" fill="#98a1ab" font-weight="400" text-anchor="middle">17</text><text x="690" y="346" font-size="9.5" fill="#98a1ab" font-weight="400" text-anchor="middle">18</text><text x="716" y="346" font-size="9.5" fill="#98a1ab" font-weight="400" text-anchor="middle">19</text><text x="742" y="346" font-size="9.5" fill="#98a1ab" font-weight="400" text-anchor="middle">20</text><text x="768" y="346" font-size="9.5" fill="#98a1ab" font-weight="400" text-anchor="middle">21</text><text x="794" y="346" font-size="9.5" fill="#98a1ab" font-weight="400" text-anchor="middle">22</text><text x="820" y="346" font-size="9.5" fill="#98a1ab" font-weight="400" text-anchor="middle">23</text><text x="846" y="346" font-size="9.5" fill="#98a1ab" font-weight="400" text-anchor="middle">24</text><text x="872" y="346" font-size="9.5" fill="#98a1ab" font-weight="400" text-anchor="middle">25</text><text x="626" y="350" font-size="11.5" fill="#fa8c16" font-weight="400" text-anchor="start">近三年发文量持续上升，说明该选题仍在升温</text><rect x="28" y="388" width="884" height="81" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="40" y="412" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 共现网络：节点越大表示该关键词在文献中出现越多；连线越粗表示两个概念同时出现的次数越多。</text><text x="40" y="431" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 读图只回答两个问题：领域的主流概念是什么？还有哪些概念与自己相关却不在词表里？</text><text x="40" y="450" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 年度趋势用来说明选题的时效性，可作为开题报告中“研究必要性”的依据之一。</text><text x="928" y="461" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面位置与网络结构为示意</text></svg>