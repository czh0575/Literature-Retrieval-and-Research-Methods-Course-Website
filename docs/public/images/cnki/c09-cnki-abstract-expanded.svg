<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="470" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">展开摘要：判断“要不要读全文”的关键一步</text><rect x="28" y="52" width="884" height="300" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><rect x="48" y="70" width="14" height="14" fill="#1677ff" rx="2.5" stroke="#1677ff" stroke-width="1"/><path d="M 51.5 77.3 l 3.1 3.4 l 4.8 -5.9" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><text x="74" y="82" font-size="15" fill="#1677ff" font-weight="500" text-anchor="start">税收优惠、融资约束与高新技术企业研发投入</text><text x="74" y="106" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">陈晓明</text><text x="134" y="106" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">财政研究，2022, (11): 45-58</text><line x1="48" y1="122" x2="892" y2="122" stroke="#e8ecf1" stroke-width="1"/><text x="48" y="146" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">摘要</text><text x="104" y="146" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">本文以 2015 年研发费用加计扣除政策扩围为准自然实验，选取 2012—2020 年 A 股上市</text><text x="104" y="165" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">公司为样本，采用双重差分模型检验税收优惠对企业研发投入的影响，并检验融资约束的中介</text><text x="104" y="184" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">作用。研究发现：加计扣除政策显著提高了处理组企业的研发投入强度，且这一效应在融资约束</text><text x="104" y="203" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">较强的中小企业中更为明显；机制检验表明，政策通过缓解融资约束提升了企业研发意愿。</text><text x="48" y="232" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">关键词</text><rect x="104" y="218" width="104.0" height="20" fill="#e8f2ff" rx="11"/><text x="156.0" y="231.96" font-size="11" fill="#1677ff" font-weight="400" text-anchor="middle">研发费用加计扣除</text><rect x="216.0" y="218" width="60.0" height="20" fill="#e8f2ff" rx="11"/><text x="246.0" y="231.96" font-size="11" fill="#1677ff" font-weight="400" text-anchor="middle">融资约束</text><rect x="284.0" y="218" width="60.0" height="20" fill="#e8f2ff" rx="11"/><text x="314.0" y="231.96" font-size="11" fill="#1677ff" font-weight="400" text-anchor="middle">企业创新</text><rect x="352.0" y="218" width="60.0" height="20" fill="#e8f2ff" rx="11"/><text x="382.0" y="231.96" font-size="11" fill="#1677ff" font-weight="400" text-anchor="middle">双重差分</text><line x1="48" y1="252" x2="892" y2="252" stroke="#e8ecf1" stroke-width="1"/><text x="48" y="276" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">引证信息：被引 61　下载 3,472　参考文献 45　共引文献 128　同被引文献 96</text><text x="48" y="300" font-size="11.5" fill="#1677ff" font-weight="400" text-anchor="start">相似文献 / 相关文献 / 读者推荐：点开可沿主题继续扩展</text><text x="48" y="326" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">基金：国家社会科学基金一般项目（编号略）</text><circle cx="16" cy="146" r="11" fill="#fa8c16"/><text x="16" y="150.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="16" cy="228" r="11" fill="#fa8c16"/><text x="16" y="232.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><circle cx="16" cy="276" r="11" fill="#fa8c16"/><text x="16" y="280.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><circle cx="16" cy="300" r="11" fill="#fa8c16"/><text x="16" y="304.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="28" y="366" width="884" height="62" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="40" y="390" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">① 摘要：先看结论句，再回看数据与方法　② 关键词：与自己的词表逐词对照，命中越多越相关</text><text x="40" y="409" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">③ 引证信息：被引与下载反映影响，参考文献数量反映文献的综述厚度　④ 相似文献：不必换关键词也能继续扩展</text><text x="928" y="461" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>