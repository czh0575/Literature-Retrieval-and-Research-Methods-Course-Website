<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="900" height="500" fill="#eef1f5"/><text x="30" y="38" font-size="17" fill="#1f2329" font-weight="700" text-anchor="start">关键词金字塔：五层结构</text><text x="30" y="62" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">从一个论文题目出发，把“知道的东西”变成“能检索的词”</text><rect x="445.0" y="92" width="250" height="46" fill="#e8f2ff" rx="8"/><text x="570" y="113" font-size="13" fill="#1677ff" font-weight="700" text-anchor="middle">上位概念</text><text x="570" y="130" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">税收优惠 / 税收政策</text><line x1="240" y1="115.0" x2="431.0" y2="115.0" stroke="#c3c9d1" stroke-width="1" stroke-dasharray="3 3"/><text x="232" y="119.0" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="end">扩大检索范围</text><circle cx="717.0" cy="115.0" r="10" fill="#fa8c16"/><text x="717.0" y="118.96" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="570" y1="140" x2="570" y2="148" stroke="#c3c9d1" stroke-width="1.4"/><path d="M 570.0 148.0 L 574.6 139.0 L 565.4 139.0 Z" fill="#c3c9d1"/><rect x="424.0" y="150" width="292" height="46" fill="#d6e8ff" rx="8"/><text x="570" y="171" font-size="13" fill="#1677ff" font-weight="700" text-anchor="middle">核心概念</text><text x="570" y="188" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">研发费用加计扣除</text><line x1="240" y1="173.0" x2="410.0" y2="173.0" stroke="#c3c9d1" stroke-width="1" stroke-dasharray="3 3"/><text x="232" y="177.0" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="end">保证相关性</text><circle cx="738.0" cy="173.0" r="10" fill="#fa8c16"/><text x="738.0" y="176.96" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><line x1="570" y1="198" x2="570" y2="206" stroke="#c3c9d1" stroke-width="1.4"/><path d="M 570.0 206.0 L 574.6 197.0 L 565.4 197.0 Z" fill="#c3c9d1"/><rect x="403.0" y="208" width="334" height="46" fill="#dff3e6" rx="8"/><text x="570" y="229" font-size="13" fill="#16a34a" font-weight="700" text-anchor="middle">同义表达</text><text x="570" y="246" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">加计扣除 / 加计扣除政策 / 研发加计扣除</text><line x1="240" y1="231.0" x2="389.0" y2="231.0" stroke="#c3c9d1" stroke-width="1" stroke-dasharray="3 3"/><text x="232" y="235.0" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="end">发现不同表述</text><circle cx="759.0" cy="231.0" r="10" fill="#fa8c16"/><text x="759.0" y="234.96" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><line x1="570" y1="256" x2="570" y2="264" stroke="#c3c9d1" stroke-width="1.4"/><path d="M 570.0 264.0 L 574.6 255.0 L 565.4 255.0 Z" fill="#c3c9d1"/><rect x="382.0" y="266" width="376" height="46" fill="#fff2dc" rx="8"/><text x="570" y="287" font-size="13" fill="#fa8c16" font-weight="700" text-anchor="middle">相关概念</text><text x="570" y="304" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">企业创新 / 研发投入 / 创新绩效 / 融资约束</text><line x1="240" y1="289.0" x2="368.0" y2="289.0" stroke="#c3c9d1" stroke-width="1" stroke-dasharray="3 3"/><text x="232" y="293.0" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="end">补齐机制与研究视角</text><circle cx="780.0" cy="289.0" r="10" fill="#fa8c16"/><text x="780.0" y="292.96" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><line x1="570" y1="314" x2="570" y2="322" stroke="#c3c9d1" stroke-width="1.4"/><path d="M 570.0 322.0 L 574.6 313.0 L 565.4 313.0 Z" fill="#c3c9d1"/><rect x="382.0" y="324" width="376" height="46" fill="#f2ecfd" rx="8"/><text x="570" y="345" font-size="13" fill="#7c3aed" font-weight="700" text-anchor="middle">英文对应词</text><text x="570" y="362" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">R&amp;D tax credit / super deduction / innovation input</text><line x1="240" y1="347.0" x2="368.0" y2="347.0" stroke="#c3c9d1" stroke-width="1" stroke-dasharray="3 3"/><text x="232" y="351.0" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="end">换库检索的前提</text><circle cx="780.0" cy="347.0" r="10" fill="#fa8c16"/><text x="780.0" y="350.96" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="30" y="390" width="840" height="56" fill="#fffbe6" rx="8" stroke="#ffe58f" stroke-width="1"/><text x="46" y="412" font-size="12.5" fill="#8a6100" font-weight="400" text-anchor="start">使用顺序：先用①②把范围框住，再用③④把文献找全，最后用⑤去外文库检索。</text><text x="46" y="432" font-size="12" fill="#8a6100" font-weight="400" text-anchor="start">每一层都要写进关键词表，并注明来源；来源不清楚的词不要放进正式检索式。</text><text x="888" y="491" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">概念示意图</text></svg>