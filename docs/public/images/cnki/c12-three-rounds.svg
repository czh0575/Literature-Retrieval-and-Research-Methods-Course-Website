<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="480" fill="#eef1f5"/><text x="28" y="36" font-size="17" fill="#1f2329" font-weight="700" text-anchor="start">三轮检索法：从“发现词”到“锁定证据”</text><text x="28" y="58" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">同一组关键词，分三轮逐步收敛，每轮只改一类条件</text><rect x="28" y="84" width="280" height="300" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="84" width="280" height="52" fill="#e8f2ff" rx="10"/><rect x="28" y="122" width="280" height="14" fill="#e8f2ff"/><text x="48" y="116" font-size="17" fill="#1677ff" font-weight="700" text-anchor="start">第一轮</text><text x="128" y="116" font-size="15" fill="#1677ff" font-weight="700" text-anchor="start">发现词</text><circle cx="52" cy="164" r="2.6" fill="#1677ff"/><text x="66" y="168" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">字段：主题</text><circle cx="52" cy="194" r="2.6" fill="#1677ff"/><text x="66" y="198" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">关键词：只放核心词 1—2 个</text><circle cx="52" cy="224" r="2.6" fill="#1677ff"/><text x="66" y="228" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">限定：不加任何条件</text><circle cx="52" cy="254" r="2.6" fill="#1677ff"/><text x="66" y="258" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">排序：被引量从高到低</text><circle cx="52" cy="284" r="2.6" fill="#1677ff"/><text x="66" y="288" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">产出：新出现的同义表达</text><circle cx="52" cy="314" r="2.6" fill="#1677ff"/><text x="66" y="318" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">结果量：数百至数千条</text><line x1="316" y1="234" x2="358" y2="234" stroke="#c3c9d1" stroke-width="2"/><path d="M 358.0 234.0 L 349.0 229.4 L 349.0 238.6 Z" fill="#c3c9d1"/><rect x="368" y="84" width="280" height="300" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="368" y="84" width="280" height="52" fill="#eaf7ee" rx="10"/><rect x="368" y="122" width="280" height="14" fill="#eaf7ee"/><text x="388" y="116" font-size="17" fill="#16a34a" font-weight="700" text-anchor="start">第二轮</text><text x="468" y="116" font-size="15" fill="#16a34a" font-weight="700" text-anchor="start">提高相关性</text><circle cx="392" cy="164" r="2.6" fill="#16a34a"/><text x="406" y="168" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">字段：主题 + 篇名组合</text><circle cx="392" cy="194" r="2.6" fill="#16a34a"/><text x="406" y="198" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">关键词：核心词 + 同义词（OR）</text><circle cx="392" cy="224" r="2.6" fill="#16a34a"/><text x="406" y="228" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">限定：只加时间范围</text><circle cx="392" cy="254" r="2.6" fill="#16a34a"/><text x="406" y="258" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">排序：相关度</text><circle cx="392" cy="284" r="2.6" fill="#16a34a"/><text x="406" y="288" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">产出：20—40 条候选文献</text><circle cx="392" cy="314" r="2.6" fill="#16a34a"/><text x="406" y="318" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">结果量：数十至数百条</text><line x1="656" y1="234" x2="698" y2="234" stroke="#c3c9d1" stroke-width="2"/><path d="M 698.0 234.0 L 689.0 229.4 L 689.0 238.6 Z" fill="#c3c9d1"/><rect x="708" y="84" width="280" height="300" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="708" y="84" width="280" height="52" fill="#fff6e8" rx="10"/><rect x="708" y="122" width="280" height="14" fill="#fff6e8"/><text x="728" y="116" font-size="17" fill="#fa8c16" font-weight="700" text-anchor="start">第三轮</text><text x="808" y="116" font-size="15" fill="#fa8c16" font-weight="700" text-anchor="start">锁定证据</text><circle cx="732" cy="164" r="2.6" fill="#fa8c16"/><text x="746" y="168" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">字段：篇名 / 关键词</text><circle cx="732" cy="194" r="2.6" fill="#fa8c16"/><text x="746" y="198" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">关键词：概念块之间用 AND</text><circle cx="732" cy="224" r="2.6" fill="#fa8c16"/><text x="746" y="228" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">限定：来源类别 + 学科 + 文献类型</text><circle cx="732" cy="254" r="2.6" fill="#fa8c16"/><text x="746" y="258" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">排序：被引 + 时间对照看</text><circle cx="732" cy="284" r="2.6" fill="#fa8c16"/><text x="746" y="288" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">产出：10—20 篇核心文献集</text><circle cx="732" cy="314" r="2.6" fill="#fa8c16"/><text x="746" y="318" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">结果量：数条至数十条</text><rect x="28" y="400" width="884" height="81" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="40" y="424" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 每一轮结束都要把新发现的词补进关键词表，并记下结果数与保留数。</text><text x="40" y="443" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 如果第一轮就没有结果，说明关键词用错了表述，应改成上位概念再试一次。</text><text x="40" y="462" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 三轮的记录合起来就是检索日志，可以直接用于开题报告的文献来源说明。</text><text x="928" y="471" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">概念示意图</text></svg>