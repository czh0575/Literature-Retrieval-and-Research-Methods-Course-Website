<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="500" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">浏览器工具栏上的 Zotero 连接器：三种状态</text><text x="28" y="56" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">图标的样子会变，变化本身就说明了当前页面能不能抓</text><rect x="28" y="84" width="884" height="84" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="84" width="5" height="84" fill="#98a1ab" rx="2.5"/><circle cx="78" cy="126" r="16" fill="#98a1ab" opacity="0.15"/><text x="78" y="132" font-size="15" fill="#98a1ab" font-weight="400" text-anchor="middle">◌</text><text x="112" y="118" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">灰色 / 空心</text><text x="112" y="142" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">当前页面没有可识别的文献信息</text><text x="600" y="118" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">操作：</text><text x="640" y="118" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">回到文献详情页或结果列表页再试</text><rect x="28" y="180" width="884" height="84" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="180" width="5" height="84" fill="#16a34a" rx="2.5"/><circle cx="78" cy="222" r="16" fill="#16a34a" opacity="0.15"/><text x="78" y="228" font-size="15" fill="#16a34a" font-weight="400" text-anchor="middle">▤</text><text x="112" y="214" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">图书 / 页面图标</text><text x="112" y="238" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">识别到单个条目，点击可保存这一条</text><text x="600" y="214" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">操作：</text><text x="640" y="214" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">点击 → 选择分类 → 保存</text><rect x="28" y="276" width="884" height="84" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="276" width="5" height="84" fill="#1677ff" rx="2.5"/><circle cx="78" cy="318" r="16" fill="#1677ff" opacity="0.15"/><text x="78" y="324" font-size="15" fill="#1677ff" font-weight="400" text-anchor="middle">▣</text><text x="112" y="310" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">文件夹图标</text><text x="112" y="334" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">识别到列表页，可以批量勾选多条</text><text x="600" y="310" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">操作：</text><text x="640" y="310" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">点击 → 勾选文献 → 选择分类 → 保存</text><rect x="28" y="376" width="884" height="96" fill="#fafbfd" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="48" y="402" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">在知网页面点击连接器后弹出的窗口</text><rect x="300" y="388" width="340" height="68" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="320" y="412" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">保存到 Zotero</text><rect x="320" y="422" width="12" height="12" fill="#1677ff" rx="2.5" stroke="#1677ff" stroke-width="1"/><path d="M 323.0 428.2 l 2.6 2.9 l 4.1 -5.0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><text x="338" y="433" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">我的文库</text><rect x="320" y="440" width="12" height="12" fill="#1677ff" rx="2.5" stroke="#1677ff" stroke-width="1"/><path d="M 323.0 446.2 l 2.6 2.9 l 4.1 -5.0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><text x="338" y="451" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">毕业论文：加计扣除与企业创新</text><rect x="556" y="432" width="68" height="22" fill="#1677ff" rx="4"/><text x="590" y="447" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">完成</text><text x="48" y="428" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">勾选目标分类后点“完成”，</text><text x="48" y="448" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">条目就会出现在 Zotero 中间栏。</text><text x="660" y="428" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">若窗口中没有想要的分类，</text><text x="660" y="448" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">先在 Zotero 里新建分类再抓取。</text><text x="928" y="491" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>