<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="520" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">自动生成的参考文献表（GB/T 7714-2015 样式）</text><text x="28" y="56" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">由正文中实际引用的条目生成，条目顺序随引用顺序自动调整</text><rect x="28" y="78" width="884" height="300" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="60" y="112" font-size="14" fill="#1f2329" font-weight="700" text-anchor="start">参考文献</text><text x="60" y="146" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">[1] 张伟, 李娜, 王强. 研发费用加计扣除政策与企业创新投入——基于双重差分法的经验证据[J]. 税务研究, 2023(05): 12-20.</text><text x="60" y="172" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">[2] 陈晓明. 税收优惠、融资约束与高新技术企业研发投入[J]. 财政研究, 2022(11): 45-58.</text><text x="60" y="198" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">[3] 刘洋, 赵敏. 加计扣除比例调整对企业创新绩效的影响研究[J]. 中央财经大学学报, 2024(02): 33-46.</text><text x="60" y="224" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">[4] SMITH J, WANG L, ROSSI M. R&amp;D tax credits and firm innovation: Evidence from a quasi-natural</text><text x="60" y="250" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">     experiment[J]. Research Policy, 2024, 53(3): 104-126.</text><text x="60" y="276" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">[5] 王芳. 中国税收优惠政策的创新效应研究[D]. 北京: 中国人民大学, 2021.</text><line x1="28" y1="300" x2="912" y2="300" stroke="#e8ecf1" stroke-width="1"/><text x="60" y="330" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">说明：上述条目由 Zotero 依据文库中的题录自动排版，中文用“等”还是全列、</text><text x="60" y="350" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">英文作者是否大写、卷期页码的连接符，都由所选样式决定。</text><rect x="28" y="396" width="884" height="110" fill="#fffbe6" rx="8" stroke="#ffe58f" stroke-width="1"/><text x="48" y="420" font-size="12" fill="#8a6100" font-weight="700" text-anchor="start">定稿前的双向核对法</text><text x="48" y="442" font-size="11.5" fill="#8a6100" font-weight="400" text-anchor="start">从正文随机抽 10 条引用 → 在文末找到对应条目；再从文末随机抽 10 条文献 → 回到正文确认确实引用过。</text><text x="48" y="462" font-size="11.5" fill="#8a6100" font-weight="400" text-anchor="start">两个方向都要查，才能同时排除“正文引了但文末没有”和“文末列了但正文没引”两类错误。</text><text x="928" y="511" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>