<svg xmlns="http://www.w3.org/2000/svg" width="960" height="506" viewBox="0 0 960 506" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="960" height="506" fill="#eef1f5"/><rect x="30" y="28" width="904" height="420" fill="#cbd3dd" rx="9" opacity="0.55"/><rect x="28" y="24" width="904" height="420" fill="#ffffff" rx="9" stroke="#d7dce3" stroke-width="1"/><rect x="28" y="24" width="904" height="26" fill="#f1f3f6" rx="9"/><rect x="28" y="40" width="904" height="20" fill="#f1f3f6"/><rect x="40" y="30" width="190" height="24" fill="#ffffff" rx="6"/><text x="52" y="46" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">论文初稿.docx - Word</text><circle cx="204" cy="42" r="4" fill="none"/><circle cx="204" cy="42" r="4" fill="none"/><circle cx="204" cy="42" r="4" fill="none"/><rect x="238" y="36" width="22" height="14" fill="none" rx="2" stroke="#98a1ab" stroke-width="1"/><rect x="40" y="60" width="880" height="20" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="50" y="66" width="8" height="8" fill="none" rx="2" stroke="#16a34a" stroke-width="1.2"/><text x="66" y="74" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start"></text><rect x="872" y="62" width="14" height="14" fill="none"/><line x1="28" y1="86" x2="932" y2="86" stroke="#d7dce3" stroke-width="1"/><rect x="28" y="86" width="904" height="30" fill="#f3f6fa"/><rect x="40" y="89" width="52" height="24" fill="none" rx="4"/><text x="66" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">开始</text><rect x="96" y="89" width="52" height="24" fill="none" rx="4"/><text x="122" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">插入</text><rect x="152" y="89" width="52" height="24" fill="none" rx="4"/><text x="178" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">设计</text><rect x="208" y="89" width="52" height="24" fill="none" rx="4"/><text x="234" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">布局</text><rect x="264" y="89" width="52" height="24" fill="none" rx="4"/><text x="290" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">引用</text><rect x="320" y="89" width="52" height="24" fill="none" rx="4"/><text x="346" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">邮件</text><rect x="376" y="89" width="52" height="24" fill="none" rx="4"/><text x="402" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">审阅</text><rect x="432" y="89" width="52" height="24" fill="none" rx="4"/><text x="458" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">视图</text><rect x="488" y="89" width="52" height="24" fill="#e8f2ff" rx="4"/><text x="514" y="106" font-size="11.5" fill="#1677ff" font-weight="700" text-anchor="start">Zotero</text><rect x="28" y="116" width="904" height="74" fill="#f7f9fb"/><line x1="28" y1="190" x2="932" y2="190" stroke="#d7dce3" stroke-width="1"/><rect x="52" y="126" width="128.71999999999997" height="30" fill="#1677ff" rx="5"/><text x="116.35999999999999" y="146" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Add/Edit Citation</text><text x="116.35999999999999" y="174" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="middle">插入 / 编辑文内引用</text><rect x="192.71999999999997" y="126" width="110" height="30" fill="#ffffff" rx="5" stroke="#d7dce3" stroke-width="1"/><text x="247.71999999999997" y="146" font-size="11" fill="#5b6470" font-weight="400" text-anchor="middle">Add Note</text><text x="247.71999999999997" y="174" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="middle">插入脚注式说明</text><rect x="314.71999999999997" y="126" width="153.35999999999996" height="30" fill="#ffffff" rx="5" stroke="#d7dce3" stroke-width="1"/><text x="391.4" y="146" font-size="11" fill="#5b6470" font-weight="400" text-anchor="middle">Add/Edit Bibliography</text><text x="391.4" y="174" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="middle">生成参考文献表</text><rect x="480.0799999999999" y="126" width="147.19999999999996" height="30" fill="#ffffff" rx="5" stroke="#d7dce3" stroke-width="1"/><text x="553.68" y="146" font-size="11" fill="#5b6470" font-weight="400" text-anchor="middle">Document Preferences</text><text x="553.68" y="174" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="middle">选择引用样式</text><rect x="639.2799999999999" y="126" width="110" height="30" fill="#ffffff" rx="5" stroke="#d7dce3" stroke-width="1"/><text x="694.2799999999999" y="146" font-size="11" fill="#5b6470" font-weight="400" text-anchor="middle">Refresh</text><text x="694.2799999999999" y="174" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="middle">刷新引用</text><rect x="761.2799999999999" y="126" width="122.55999999999997" height="30" fill="#ffffff" rx="5" stroke="#d7dce3" stroke-width="1"/><text x="822.5599999999998" y="146" font-size="11" fill="#5b6470" font-weight="400" text-anchor="middle">Unlink Citations</text><text x="822.5599999999998" y="174" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="middle">解除域代码（谨慎）</text><rect x="68" y="216" width="824" height="200" fill="#ffffff" rx="4" stroke="#e8ecf1" stroke-width="1"/><text x="88" y="248" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">二、文献综述</text><text x="88" y="276" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">已有研究普遍认为，研发费用加计扣除政策对企业创新投入具有显著促进作用（张伟等，2023）。</text><text x="88" y="300" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">但也有研究指出，政策效果受到企业规模与融资约束的影响（陈晓明，2022）。</text><rect x="428" y="264" width="128" height="18" fill="#f5f7fa" rx="3" stroke="#e8ecf1" stroke-width="1"/><text x="492" y="277" font-size="9.5" fill="#98a1ab" font-weight="400" text-anchor="middle">Zotero 域代码</text><circle cx="44" cy="140" r="11" fill="#fa8c16"/><text x="44" y="144.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="44" cy="238" r="11" fill="#fa8c16"/><text x="44" y="242.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="68" y="428" width="824" height="62" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="80" y="452" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">① Zotero 选项卡只在 Word / WPS 中安装插件后出现，第一项「Add/Edit Citation」用于插入文内引用。</text><text x="80" y="471" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">② 灰色底纹表示这是 Zotero 生成的域代码，不是手打的文字；改题录后点 Refresh 即可全文更新。</text><text x="948" y="497" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>