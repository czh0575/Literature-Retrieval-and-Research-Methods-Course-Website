" fill="#e8b400" font-weight="400" text-anchor="middle">▣</text><circle cx="99" cy="103" r="10" fill="#5b6470" opacity="0.18"/><text x="99" y="108" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">⚯</text><circle cx="125" cy="103" r="10" fill="#5b6470" opacity="0.18"/><text x="125" y="108" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">✎</text><circle cx="151" cy="103" r="10" fill="#5b6470" opacity="0.18"/><text x="151" y="108" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="middle">⌕</text><circle cx="177" cy="103" r="10" fill="#16a34a" opacity="0.18"/><text x="177" y="108" font-size="11.5" fill="#16a34a" font-weight="400" text-anchor="middle">↻</text><rect x="746" y="93" width="174" height="21" fill="#ffffff" rx="11" stroke="#d7dce3" stroke-width="1"/><text x="758" y="108" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">搜索我的文库…</text><rect x="24" y="120" width="210" height="400" fill="#fafbfd"/><line x1="234" y1="120" x2="234" y2="520" stroke="#d7dce3" stroke-width="1"/><text x="40" y="150" font-size="11.5" fill="#5b6470" font-weight="700" text-anchor="start">我的文库</text><text x="40" y="174" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">课程资料</text><text x="40" y="198" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">毕业论文</text><rect x="234" y="120" width="300" height="400" fill="#ffffff"/><line x1="534" y1="120" x2="534" y2="520" stroke="#d7dce3" stroke-width="1"/><rect x="534" y="120" width="400" height="400" fill="#ffffff"/><rect x="174" y="150" width="620" height="400" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><rect x="174" y="150" width="620" height="40" fill="#f1f3f6" rx="8"/><rect x="174" y="178" width="620" height="12" fill="#f1f3f6"/><text x="196" y="176" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">插件</text><text x="750" y="176" font-size="14" fill="#5b6470" font-weight="400" text-anchor="middle">⚙</text><line x1="174" y1="190" x2="794" y2="190" stroke="#d7dce3" stroke-width="1"/><text x="196" y="216" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">茉莉花（Jasminum）</text><text x="354" y="216" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">1.0.x</text><text x="196" y="236" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">中文文献增强：抓取知网元数据、下载 PDF、拆分作者姓名</text><rect x="704" y="204" width="70" height="24" fill="#f5f7fa" rx="4" stroke="#d7dce3" stroke-width="1"/><text x="739" y="220" font-size="11" fill="#5b6470" font-weight="400" text-anchor="middle">选项</text><line x1="196" y1="254" x2="772" y2="254" stroke="#e8ecf1" stroke-width="1"/><text x="196" y="280" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">Zotero 中文社区插件商店（可选）</text><text x="196" y="300" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">1.0.x</text><line x1="196" y1="318" x2="772" y2="318" stroke="#e8ecf1" stroke-width="1"/><rect x="650" y="172" width="168" height="96" fill="#ffffff" rx="6" stroke="#d7dce3" stroke-width="1"/><rect x="652" y="174" width="164" height="22" fill="#e8f2ff"/><text x="662" y="189" font-size="10.5" fill="#1677ff" font-weight="400" text-anchor="start">Install Plugin From File…</text><text x="662" y="212" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">Check for Updates</text><text x="662" y="235" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">Reset Translators</text><text x="662" y="258" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">Disable All Plugins</text><text x="196" y="396" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">1  到 Zotero 中文社区或 GitHub 仓库下载与当前版本匹配的 .xpi 文件</text><text x="196" y="422" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">2  Zotero 菜单：工具 → 插件</text><text x="196" y="448" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">3  点击插件面板右上角齿轮 → Install Plugin From File…</text><text x="196" y="474" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">4  选择刚下载的 .xpi 文件并确认</text><text x="196" y="500" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">5  重启 Zotero，回到插件面板确认已启用</text><rect x="196" y="532" width="576" height="0" fill="none"/><circle cx="160" cy="178" r="11" fill="#fa8c16"/><text x="160" y="182.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="174" y="548" width="620" height="58" fill="#fffbe6" rx="8" stroke="#ffe58f" stroke-width="1"/><text x="186" y="571" font-size="11" fill="#8a6100" font-weight="400" text-anchor="start">第三方插件由社区维护，务必从官方仓库或中文社区下载，不要使用来源不明的安装包；</text><text x="186" y="588" font-size="11" fill="#8a6100" font-weight="400" text-anchor="start">Zotero 大版本升级后插件可能暂时不兼容，需要等待作者适配或重新安装。</text><text x="948" y="617" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>