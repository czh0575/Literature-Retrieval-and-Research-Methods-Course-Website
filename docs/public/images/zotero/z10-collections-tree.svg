<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="470" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">左栏资料库与分类树</text><text x="28" y="56" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">分类按“研究任务”划分，层级不超过三层</text><rect x="28" y="78" width="420" height="372" fill="#fafbfd" rx="8" stroke="#d7dce3" stroke-width="1"/><path d="M 44 97 l 5 5 l 5 -5" fill="none" stroke="#98a1ab" stroke-width="1.6" stroke-linecap="round"/><text x="60" y="106" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">我的文库</text><path d="M 62 121 l 5 5 l 5 -5" fill="none" stroke="#98a1ab" stroke-width="1.6" stroke-linecap="round"/><text x="78" y="130" font-size="11.5" fill="#5b6470" font-weight="700" text-anchor="start">课程：文献检索与研究方法</text><rect x="82" y="143" width="11" height="11" fill="#f5d28a" rx="2" stroke="#fa8c16" stroke-width="1"/><text x="102" y="154" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">01 检索方法与规范</text><rect x="82" y="167" width="11" height="11" fill="#f5d28a" rx="2" stroke="#fa8c16" stroke-width="1"/><text x="102" y="178" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">02 学术道德与引用</text><rect x="82" y="191" width="11" height="11" fill="#f5d28a" rx="2" stroke="#fa8c16" stroke-width="1"/><text x="102" y="202" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">03 文献综述写作</text><rect x="36" y="212" width="400" height="22" fill="#e8f2ff" rx="4"/><path d="M 62 217 l 5 5 l 5 -5" fill="none" stroke="#98a1ab" stroke-width="1.6" stroke-linecap="round"/><text x="78" y="226" font-size="11.5" fill="#1677ff" font-weight="700" text-anchor="start">毕业论文：研发费用加计扣除与企业创新</text><rect x="36" y="236" width="400" height="22" fill="#e8f2ff" rx="4"/><rect x="82" y="239" width="11" height="11" fill="#ffffff" rx="2" stroke="#1677ff" stroke-width="1"/><text x="102" y="250" font-size="11.5" fill="#1677ff" font-weight="400" text-anchor="start">01 政策与背景</text><rect x="36" y="260" width="400" height="22" fill="#e8f2ff" rx="4"/><rect x="82" y="263" width="11" height="11" fill="#ffffff" rx="2" stroke="#1677ff" stroke-width="1"/><text x="102" y="274" font-size="11.5" fill="#1677ff" font-weight="400" text-anchor="start">02 理论与机制</text><rect x="82" y="287" width="11" height="11" fill="#f5d28a" rx="2" stroke="#fa8c16" stroke-width="1"/><text x="102" y="298" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">03 实证与数据方法</text><rect x="82" y="311" width="11" height="11" fill="#f5d28a" rx="2" stroke="#fa8c16" stroke-width="1"/><text x="102" y="322" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">04 国外经验与比较</text><rect x="82" y="335" width="11" height="11" fill="#f5d28a" rx="2" stroke="#fa8c16" stroke-width="1"/><text x="102" y="346" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">05 待读文献</text><path d="M 44 361 l 5 5 l 5 -5" fill="none" stroke="#98a1ab" stroke-width="1.6" stroke-linecap="round"/><text x="60" y="370" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">重复条目</text><path d="M 44 385 l 5 5 l 5 -5" fill="none" stroke="#98a1ab" stroke-width="1.6" stroke-linecap="round"/><text x="60" y="394" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">未分类条目</text><path d="M 44 409 l 5 5 l 5 -5" fill="none" stroke="#98a1ab" stroke-width="1.6" stroke-linecap="round"/><text x="60" y="418" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">回收站</text><rect x="468" y="78" width="444" height="176" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="488" y="106" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">分类与标签的分工</text><text x="488" y="126" font-size="11.5" fill="#1677ff" font-weight="700" text-anchor="start">分类 Collection</text><text x="488" y="146" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">回答“属于哪个研究任务”</text><text x="488" y="164" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">同一层级内是排他的</text><text x="488" y="188" font-size="11.5" fill="#1677ff" font-weight="700" text-anchor="start">标签 Tag</text><text x="488" y="208" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">回答“现在什么状态、用在哪里”</text><text x="488" y="226" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">每条可以有多个</text><rect x="468" y="270" width="444" height="180" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="488" y="298" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">操作要点</text><text x="488" y="326" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· 新建分类：工具栏黄色文件夹按钮或右键“新建分类”</text><text x="488" y="350" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· 拖拽条目到分类：按住 Ctrl/Cmd 拖 = 加入而不移出原分类</text><text x="488" y="374" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· 从分类移除：右键“从分类中移除”，条目仍保留在我的文库</text><text x="488" y="398" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· 删除分类不会删除条目，删除条目才会进回收站</text><text x="488" y="422" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">· 分类名不要用“新建分类 1”，要写清研究任务</text><text x="928" y="461" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>