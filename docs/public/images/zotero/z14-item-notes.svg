<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="480" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">从批注到笔记：条目与子条目的结构</text><text x="28" y="56" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">笔记挂在条目下面，可以随条目一起导出与备份</text><rect x="28" y="78" width="520" height="240" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="46" y="106" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">中间栏：条目与子条目</text><line x1="46" y1="118" x2="530" y2="118" stroke="#e8ecf1" stroke-width="1"/><rect x="40" y="128" width="486" height="22" fill="#1677ff"/><text x="76" y="142" font-size="10" fill="#ffffff" font-weight="400" text-anchor="start">⚯</text><text x="94" y="142" font-size="11" fill="#ffffff" font-weight="400" text-anchor="start">研发费用加计扣除政策与企业创新投入</text><path d="M 60 161 l 6 5 l -6 5" fill="none" stroke="#98a1ab" stroke-width="1.4" stroke-linecap="round"/><text x="96" y="170" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">✎</text><text x="114" y="170" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">阅读笔记：政策背景与识别策略</text><path d="M 60 189 l 6 5 l -6 5" fill="none" stroke="#98a1ab" stroke-width="1.4" stroke-linecap="round"/><text x="96" y="198" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">✎</text><text x="114" y="198" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">阅读笔记：变量与数据来源</text><text x="76" y="226" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">⚯</text><text x="94" y="226" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">税收优惠、融资约束与高新技术企业研发投入</text><path d="M 60 245 l 6 5 l -6 5" fill="none" stroke="#98a1ab" stroke-width="1.4" stroke-linecap="round"/><text x="96" y="254" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">✎</text><text x="114" y="254" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">阅读笔记：机制检验部分</text><text x="76" y="282" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">⚯</text><text x="94" y="282" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">加计扣除比例调整对企业创新绩效的影响</text><text x="46" y="300" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">三角箭头展开后可看到该条目下的全部笔记</text><rect x="568" y="78" width="344" height="240" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="586" y="106" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">笔记的三层结构</text><rect x="586" y="124" width="308" height="58" fill="#f5f7fa" rx="6"/><rect x="586" y="124" width="4" height="58" fill="#1677ff" rx="2"/><text x="600" y="146" font-size="11.5" fill="#1677ff" font-weight="700" text-anchor="start">① 内容摘要</text><text x="600" y="166" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">作者研究了什么、用什么材料、得出什么结论</text><rect x="586" y="190" width="308" height="58" fill="#f5f7fa" rx="6"/><rect x="586" y="190" width="4" height="58" fill="#16a34a" rx="2"/><text x="600" y="212" font-size="11.5" fill="#16a34a" font-weight="700" text-anchor="start">② 证据摘录</text><text x="600" y="232" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">可核对的原文、页码、表格位置（标明是原文）</text><rect x="586" y="256" width="308" height="58" fill="#f5f7fa" rx="6"/><rect x="586" y="256" width="4" height="58" fill="#fa8c16" rx="2"/><text x="600" y="278" font-size="11.5" fill="#fa8c16" font-weight="700" text-anchor="start">③ 我的判断</text><text x="600" y="298" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">对我选题有什么用、有什么局限、能否比较</text><rect x="28" y="336" width="884" height="118" fill="#fffbe6" rx="8" stroke="#ffe58f" stroke-width="1"/><text x="48" y="362" font-size="12" fill="#8a6100" font-weight="700" text-anchor="start">笔记示例（节选）</text><text x="48" y="384" font-size="11" fill="#8a6100" font-weight="400" text-anchor="start">【内容摘要】以 2015 年加计扣除政策扩围为准自然实验，用 2012—2020 年 A 股高新技术企业面板数据，DID 检验政策对研发投入的影响。</text><text x="48" y="404" font-size="11" fill="#8a6100" font-weight="400" text-anchor="start">【证据摘录】原文第 8 页：“政策显著提高了处理组企业的研发投入强度，且在融资约束较强的中小企业中更明显。”</text><text x="48" y="424" font-size="11" fill="#8a6100" font-weight="400" text-anchor="start">【我的判断】政策时点与本文一致，可作为政策背景论据；但样本为上市公司，小微企业结论需谨慎外推，可作为本文局限讨论。</text><text x="928" y="471" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>