<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="960" height="470" fill="#eef1f5"/><text x="28" y="40" font-size="17" fill="#1f2329" font-weight="700" text-anchor="start">Zotero 的四个组成部分</text><text x="28" y="62" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">四者分工不同，缺一个就会有一类事情做不了</text><rect x="28" y="92" width="218" height="226" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="92" width="218" height="8" fill="#8b1f1f" rx="4"/><circle cx="58" cy="128" r="15" fill="#8b1f1f" opacity="0.14"/><text x="58" y="134" font-size="12" fill="#8b1f1f" font-weight="700" text-anchor="middle">Ⅰ</text><text x="82" y="124" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">Zotero 主程序</text><text x="82" y="142" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">资料库本体</text><line x1="44" y1="160" x2="230" y2="160" stroke="#e8ecf1" stroke-width="1"/><circle cx="50" cy="182" r="2.4" fill="#8b1f1f"/><text x="62" y="186" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">存题录、附件、笔记</text><circle cx="50" cy="210" r="2.4" fill="#8b1f1f"/><text x="62" y="214" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">阅读与批注</text><circle cx="50" cy="238" r="2.4" fill="#8b1f1f"/><text x="62" y="242" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">分类与标签</text><rect x="44" y="274" width="118" height="22" fill="#8b1f1f" rx="11" opacity="0.1"/><text x="103" y="289" font-size="10" fill="#8b1f1f" font-weight="400" text-anchor="middle">桌面程序</text><line x1="248" y1="205" x2="260" y2="205" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 260.0 205.0 L 251.0 200.4 L 251.0 209.6 Z" fill="#c3c9d1"/><rect x="262" y="92" width="218" height="226" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="262" y="92" width="218" height="8" fill="#1677ff" rx="4"/><circle cx="292" cy="128" r="15" fill="#1677ff" opacity="0.14"/><text x="292" y="134" font-size="12" fill="#1677ff" font-weight="700" text-anchor="middle">Ⅱ</text><text x="316" y="124" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">Zotero Connector</text><text x="316" y="142" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">浏览器连接器</text><line x1="278" y1="160" x2="464" y2="160" stroke="#e8ecf1" stroke-width="1"/><circle cx="284" cy="182" r="2.4" fill="#1677ff"/><text x="296" y="186" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">从网页抓取题录</text><circle cx="284" cy="210" r="2.4" fill="#1677ff"/><text x="296" y="214" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">识别文献类型</text><circle cx="284" cy="238" r="2.4" fill="#1677ff"/><text x="296" y="242" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">下载全文（配合插件）</text><rect x="278" y="274" width="118" height="22" fill="#1677ff" rx="11" opacity="0.1"/><text x="337" y="289" font-size="10" fill="#1677ff" font-weight="400" text-anchor="middle">浏览器扩展</text><line x1="482" y1="205" x2="494" y2="205" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 494.0 205.0 L 485.0 200.4 L 485.0 209.6 Z" fill="#c3c9d1"/><rect x="496" y="92" width="218" height="226" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="496" y="92" width="218" height="8" fill="#16a34a" rx="4"/><circle cx="526" cy="128" r="15" fill="#16a34a" opacity="0.14"/><text x="526" y="134" font-size="12" fill="#16a34a" font-weight="700" text-anchor="middle">Ⅲ</text><text x="550" y="124" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">文字处理器插件</text><text x="550" y="142" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">Word / WPS 插件</text><line x1="512" y1="160" x2="698" y2="160" stroke="#e8ecf1" stroke-width="1"/><circle cx="518" cy="182" r="2.4" fill="#16a34a"/><text x="530" y="186" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">插入文内引用</text><circle cx="518" cy="210" r="2.4" fill="#16a34a"/><text x="530" y="214" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">生成参考文献表</text><circle cx="518" cy="238" r="2.4" fill="#16a34a"/><text x="530" y="242" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">随题录更新刷新</text><rect x="512" y="274" width="118" height="22" fill="#16a34a" rx="11" opacity="0.1"/><text x="571" y="289" font-size="10" fill="#16a34a" font-weight="400" text-anchor="middle">随主程序安装</text><line x1="716" y1="205" x2="728" y2="205" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 728.0 205.0 L 719.0 200.4 L 719.0 209.6 Z" fill="#c3c9d1"/><rect x="730" y="92" width="218" height="226" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="730" y="92" width="218" height="8" fill="#7c3aed" rx="4"/><circle cx="760" cy="128" r="15" fill="#7c3aed" opacity="0.14"/><text x="760" y="134" font-size="12" fill="#7c3aed" font-weight="700" text-anchor="middle">Ⅳ</text><text x="784" y="124" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">Zotero 账号与云</text><text x="784" y="142" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">同步与备份</text><line x1="746" y1="160" x2="932" y2="160" stroke="#e8ecf1" stroke-width="1"/><circle cx="752" cy="182" r="2.4" fill="#7c3aed"/><text x="764" y="186" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">跨设备同步题录</text><circle cx="752" cy="210" r="2.4" fill="#7c3aed"/><text x="764" y="214" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">同步附件（空间有限）</text><circle cx="752" cy="238" r="2.4" fill="#7c3aed"/><text x="764" y="242" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">群组协作</text><rect x="746" y="274" width="118" height="22" fill="#7c3aed" rx="11" opacity="0.1"/><text x="805" y="289" font-size="10" fill="#7c3aed" font-weight="400" text-anchor="middle">需要注册</text><rect x="28" y="336" width="904" height="108" fill="#fafbfd" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="48" y="362" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">最常见的两种漏装</text><text x="48" y="386" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">① 只装主程序不装连接器 → 每条文献都要手敲作者、卷期、页码，工作量翻十倍，且容易出错。</text><text x="48" y="410" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">② 只装连接器不装主程序（或没打开主程序）→ 点击图标后无处可存，抓取会失败或只生成网页快照。</text><text x="948" y="461" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">概念示意图</text></svg>