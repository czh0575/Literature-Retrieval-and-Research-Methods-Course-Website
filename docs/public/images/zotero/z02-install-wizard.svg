<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="880" height="440" fill="#eef1f5"/><rect x="0" y="0" width="880" height="440" fill="#eef1f5"/><rect x="120" y="60" width="640" height="320" fill="#ffffff" rx="10" stroke="#d7dce3" stroke-width="1"/><rect x="120" y="60" width="640" height="44" fill="#f1f3f6" rx="10"/><rect x="120" y="92" width="640" height="12" fill="#f1f3f6"/><text x="144" y="90" font-size="13.5" fill="#1f2329" font-weight="700" text-anchor="start">Zotero 安装向导</text><line x1="120" y1="104" x2="760" y2="104" stroke="#d7dce3" stroke-width="1"/><text x="148" y="146" font-size="16" fill="#1f2329" font-weight="700" text-anchor="start">欢迎使用 Zotero 安装向导</text><text x="148" y="174" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">向导将引导你完成安装。安装前建议关闭正在运行的浏览器，</text><text x="148" y="194" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">以便自动配置浏览器连接器。</text><line x1="148" y1="216" x2="732" y2="216" stroke="#e8ecf1" stroke-width="1"/><text x="148" y="244" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">安装位置</text><text x="280" y="244" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">C:\Program Files\Zotero</text><text x="148" y="274" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">安装类型</text><text x="280" y="274" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">Standard（推荐）</text><text x="148" y="304" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">附加选项</text><text x="280" y="304" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">☑ 安装浏览器连接器　☑ 创建桌面快捷方式</text><rect x="520" y="330" width="100" height="32" fill="#f5f7fa" rx="5" stroke="#d7dce3" stroke-width="1"/><text x="570" y="351" font-size="12" fill="#5b6470" font-weight="400" text-anchor="middle">Back</text><rect x="632" y="330" width="100" height="32" fill="#1677ff" rx="5"/><text x="682" y="351" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">Install</text><circle cx="104" cy="244" r="11" fill="#fa8c16"/><text x="104" y="248.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="104" cy="274" r="11" fill="#fa8c16"/><text x="104" y="278.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><circle cx="104" cy="304" r="11" fill="#fa8c16"/><text x="104" y="308.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="40" y="116" width="66" height="24" fill="none" rx="8" stroke="none" stroke-width="1"/><text x="40" y="400" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">① 安装位置用默认值即可　② 安装类型选 Standard　③ 勾选安装浏览器连接器，能省去后面单独配置的步骤</text><text x="868" y="431" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>