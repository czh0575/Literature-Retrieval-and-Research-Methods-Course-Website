<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="960" height="560" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">右栏“信息”面板：题录字段逐个看</text><text x="28" y="56" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">字段随“条目类型”变化；校对题录就是在这里改</text><rect x="28" y="78" width="520" height="462" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="48" y="106" font-size="11.5" fill="#1677ff" font-weight="700" text-anchor="start">信息</text><text x="108" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">摘要</text><text x="168" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">附件</text><text x="228" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">笔记</text><text x="288" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">标签</text><text x="348" y="106" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">相关</text><rect x="44" y="114" width="30" height="2.5" fill="#1677ff"/><line x1="44" y1="120" x2="532" y2="120" stroke="#e8ecf1" stroke-width="1"/><text x="48" y="148" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">条目类型</text><rect x="150" y="133" width="368" height="22" fill="#ffffff" rx="3" stroke="#1677ff" stroke-width="1"/><text x="158" y="148" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">期刊论文</text><line x1="150" y1="156" x2="518" y2="156" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="175" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">标题</text><text x="158" y="175" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">研发费用加计扣除政策与企业创新投入</text><line x1="150" y1="183" x2="518" y2="183" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="202" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">作者</text><text x="158" y="202" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">张伟　李娜　王强</text><line x1="150" y1="210" x2="518" y2="210" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="229" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">出版物</text><text x="158" y="229" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">税务研究</text><line x1="150" y1="237" x2="518" y2="237" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="256" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">卷</text><text x="158" y="256" font-size="11.5" fill="#c3c9d1" font-weight="400" text-anchor="start">—</text><line x1="150" y1="264" x2="518" y2="264" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="283" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">期</text><text x="158" y="283" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">05</text><line x1="150" y1="291" x2="518" y2="291" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="310" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">页码</text><text x="158" y="310" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">12-20</text><line x1="150" y1="318" x2="518" y2="318" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="337" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">日期</text><text x="158" y="337" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">2023-05-15</text><line x1="150" y1="345" x2="518" y2="345" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="364" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">DOI</text><text x="158" y="364" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">10.xxxx/xxxxx</text><line x1="150" y1="372" x2="518" y2="372" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="391" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">URL</text><text x="158" y="391" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">https://kns.cnki.net/…</text><line x1="150" y1="399" x2="518" y2="399" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="418" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">语言</text><text x="158" y="418" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">zh-CN</text><line x1="150" y1="426" x2="518" y2="426" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="445" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">期刊缩写</text><text x="158" y="445" font-size="11.5" fill="#c3c9d1" font-weight="400" text-anchor="start">—</text><line x1="150" y1="453" x2="518" y2="453" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="472" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">ISSN</text><text x="158" y="472" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">1003-448X</text><line x1="150" y1="480" x2="518" y2="480" stroke="#e8ecf1" stroke-width="0.8"/><text x="48" y="499" font-size="11" fill="#98a1ab" font-weight="400" text-anchor="start">其它</text><text x="158" y="499" font-size="11.5" fill="#c3c9d1" font-weight="400" text-anchor="start">—</text><line x1="150" y1="507" x2="518" y2="507" stroke="#e8ecf1" stroke-width="0.8"/><text x="576" y="84" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">条目类型</text><text x="576" y="102" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">期刊论文 / 学位论文 / 会议论文 / 图书 / 网页，选错会改变可用字段</text><text x="576" y="148" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">作者</text><text x="576" y="166" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">注意区分“姓名”与“机构”两种作者类型；用上下箭头调整顺序</text><text x="576" y="212" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">出版物</text><text x="576" y="230" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">填期刊全称，不要用简称</text><text x="576" y="276" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">卷 / 期 / 页码</text><text x="576" y="294" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">中文期刊常只标期号；页码不要带多余符号</text><text x="576" y="340" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">日期</text><text x="576" y="358" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">格式为 YYYY-MM-DD，知网导出的日期偶有出错</text><text x="576" y="404" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">DOI</text><text x="576" y="422" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">没有可留空，不要填数据库链接</text><text x="576" y="468" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">语言</text><text x="576" y="486" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">填 zh-CN 或 en，影响后续排序与样式</text><text x="948" y="551" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>