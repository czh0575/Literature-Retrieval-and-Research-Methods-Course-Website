<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="960" height="500" fill="#eef1f5"/><rect x="32" y="28" width="900" height="450" fill="#cbd3dd" rx="9" opacity="0.55"/><rect x="30" y="24" width="900" height="450" fill="#ffffff" rx="9" stroke="#d7dce3" stroke-width="1"/><rect x="30" y="24" width="900" height="26" fill="#f1f3f6" rx="9"/><rect x="30" y="40" width="900" height="20" fill="#f1f3f6"/><rect x="42" y="30" width="190" height="24" fill="#ffffff" rx="6"/><text x="54" y="46" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Zotero</text><circle cx="206" cy="42" r="4" fill="none"/><circle cx="206" cy="42" r="4" fill="none"/><circle cx="206" cy="42" r="4" fill="none"/><rect x="240" y="36" width="22" height="14" fill="none" rx="2" stroke="#98a1ab" stroke-width="1"/><rect x="42" y="60" width="876" height="20" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="52" y="66" width="8" height="8" fill="none" rx="2" stroke="#16a34a" stroke-width="1.2"/><text x="68" y="74" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">https://www.zotero.org/download/</text><rect x="870" y="62" width="14" height="14" fill="none"/><line x1="30" y1="86" x2="930" y2="86" stroke="#d7dce3" stroke-width="1"/><rect x="30" y="86" width="900" height="38" fill="#f7f9fb"/><line x1="30" y1="124" x2="930" y2="124" stroke="#e8ecf1" stroke-width="1"/><rect x="46" y="94" width="4" height="18" fill="#8b1f1f" rx="2"/><text x="58" y="108" font-size="14" fill="#8b1f1f" font-weight="700" text-anchor="start">Zotero</text><text x="190" y="110" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">Home</text><text x="318" y="110" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">Groups</text><text x="446" y="110" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">Documentation</text><text x="574" y="110" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">Forums</text><text x="702" y="110" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">Get Involved</text><text x="60" y="164" font-size="20" fill="#1f2329" font-weight="700" text-anchor="start">Download</text><text x="60" y="190" font-size="12" fill="#98a1ab" font-weight="400" text-anchor="start">Zotero 免费、开源，主程序与浏览器连接器需要分别安装</text><rect x="60" y="208" width="400" height="190" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="80" y="236" font-size="13.5" fill="#1f2329" font-weight="700" text-anchor="start">1  Zotero（主程序）</text><text x="80" y="258" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">管理资料库、阅读与批注、生成参考文献</text><rect x="80" y="274" width="360" height="26" fill="#f5f7fa" rx="5" stroke="#e8ecf1" stroke-width="1"/><text x="94" y="292" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Download for Windows</text><text x="426" y="292" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="end">64-bit</text><rect x="80" y="306" width="360" height="26" fill="#f5f7fa" rx="5" stroke="#e8ecf1" stroke-width="1"/><text x="94" y="324" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Download for macOS</text><text x="426" y="324" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="end">Universal</text><rect x="80" y="338" width="360" height="26" fill="#f5f7fa" rx="5" stroke="#e8ecf1" stroke-width="1"/><text x="94" y="356" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Download for Linux</text><text x="426" y="356" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="end">64-bit</text><rect x="484" y="208" width="416" height="190" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="504" y="236" font-size="13.5" fill="#1f2329" font-weight="700" text-anchor="start">2  Zotero Connector（浏览器连接器）</text><text x="504" y="258" font-size="11.5" fill="#98a1ab" font-weight="400" text-anchor="start">负责从网页一键抓取题录与全文，必须单独安装</text><rect x="504" y="274" width="376" height="26" fill="#f5f7fa" rx="5" stroke="#e8ecf1" stroke-width="1"/><text x="518" y="292" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Install Chrome / Edge</text><text x="866" y="292" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="end">应用商店安装</text><rect x="504" y="306" width="376" height="26" fill="#f5f7fa" rx="5" stroke="#e8ecf1" stroke-width="1"/><text x="518" y="324" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Install Firefox</text><text x="866" y="324" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="end">附加组件安装</text><rect x="504" y="338" width="376" height="26" fill="#f5f7fa" rx="5" stroke="#e8ecf1" stroke-width="1"/><text x="518" y="356" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">Install Safari</text><text x="866" y="356" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="end">系统扩展安装</text><circle cx="46" cy="232" r="11" fill="#fa8c16"/><text x="46" y="236.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="470" cy="232" r="11" fill="#fa8c16"/><text x="470" y="236.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="60" y="416" width="840" height="100" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="72" y="440" font-size="12.5" fill="#5b6470" font-weight="700" text-anchor="start">下载页要点</text><text x="72" y="459" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 两个都要装：只装主程序就只能手敲题录；只装连接器则抓下来的内容无处存放。</text><text x="72" y="478" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 版本会持续更新，安装时以官网当前提供的版本与按钮文字为准。</text><text x="72" y="497" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">· 主程序与连接器建议同时升级到新版本，避免接口不匹配导致抓取失败。</text><text x="948" y="491" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>