<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="960" height="520" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">在知网下载全文，并挂到 Zotero 条目上</text><text x="28" y="56" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">三条路径：插件下载 / 手工下载后拖入 / 查找可用 PDF</text><rect x="28" y="84" width="540" height="300" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><rect x="28" y="84" width="540" height="30" fill="#f1f3f6" rx="8"/><rect x="28" y="104" width="540" height="10" fill="#f1f3f6"/><text x="42" y="104" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">知网文献详情页</text><line x1="28" y1="114" x2="568" y2="114" stroke="#d7dce3" stroke-width="1"/><text x="48" y="146" font-size="13" fill="#1677ff" font-weight="500" text-anchor="start">研发费用加计扣除政策与企业创新投入</text><text x="48" y="168" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">张伟, 李娜, 王强　税务研究　2023, (05): 12-20</text><line x1="48" y1="182" x2="548" y2="182" stroke="#e8ecf1" stroke-width="1"/><rect x="48" y="194" width="112" height="32" fill="#1a5fb4" rx="5"/><text x="104" y="215" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">PDF 下载</text><rect x="170" y="194" width="112" height="32" fill="#ffffff" rx="5" stroke="#1a5fb4" stroke-width="1"/><text x="226" y="215" font-size="12" fill="#1a5fb4" font-weight="600" text-anchor="middle">CAJ 下载</text><text x="298" y="215" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">HTML 阅读</text><text x="48" y="250" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">提示：知网全文需要机构订阅，请先登录并确认处于学校许可范围内。</text><rect x="48" y="272" width="500" height="90" fill="#fffbe6" rx="6" stroke="#ffe58f" stroke-width="1"/><text x="64" y="296" font-size="11.5" fill="#8a6100" font-weight="700" text-anchor="start">CAJ 与 PDF 的区别</text><text x="64" y="316" font-size="10.5" fill="#8a6100" font-weight="400" text-anchor="start">CAJ 是知网自有格式，Zotero 内置阅读器无法直接打开；</text><text x="64" y="334" font-size="10.5" fill="#8a6100" font-weight="400" text-anchor="start">能用 PDF 就用 PDF，只有 CAJ 时可用 CAJViewer 转出 PDF。</text><rect x="596" y="84" width="336" height="300" fill="#ffffff" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="612" y="112" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">Zotero：右键菜单中的条目操作</text><line x1="612" y1="124" x2="916" y2="124" stroke="#e8ecf1" stroke-width="1"/><text x="616" y="152" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">添加附件</text><text x="616" y="180" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">添加笔记</text><rect x="604" y="192" width="320" height="24" fill="#e8f2ff" rx="4"/><text x="616" y="208" font-size="11" fill="#1677ff" font-weight="400" text-anchor="start">抓取知网元数据（茉莉花）</text><rect x="604" y="220" width="320" height="24" fill="#e8f2ff" rx="4"/><text x="616" y="236" font-size="11" fill="#1677ff" font-weight="400" text-anchor="start">下载 PDF（茉莉花）</text><rect x="604" y="248" width="320" height="24" fill="#e8f2ff" rx="4"/><text x="616" y="264" font-size="11" fill="#1677ff" font-weight="400" text-anchor="start">查找可用的 PDF</text><rect x="604" y="276" width="320" height="24" fill="#e8f2ff" rx="4"/><text x="616" y="292" font-size="11" fill="#1677ff" font-weight="400" text-anchor="start">抓取 PDF 元数据</text><text x="616" y="320" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">移至回收站</text><text x="612" y="352" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">带高亮的三项由茉莉花插件提供</text><line x1="612" y1="362" x2="916" y2="362" stroke="#e8ecf1" stroke-width="1"/><circle cx="36" cy="211" r="11" fill="#fa8c16"/><text x="36" y="215.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="600" cy="211" r="11" fill="#fa8c16"/><text x="600" y="215.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="28" y="400" width="904" height="81" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="40" y="424" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">路径一：登录知网 → 详情页下载 PDF → 把 PDF 从“下载”文件夹拖到 Zotero 中对应条目上（作为附件）。</text><text x="40" y="443" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">路径二：在 Zotero 中选中条目 → 右键 → 使用茉莉花插件的“下载 PDF”，由插件请求知网接口下载并自动挂为附件。</text><text x="40" y="462" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">路径三：右键 → “查找可用的 PDF”，由 Zotero 在公开来源里检索，中文文献成功率有限。</text><text x="28" y="500" font-size="11.5" fill="#d93a3a" font-weight="400" text-anchor="start">使用提醒：全文下载仅限本人学习研究，不得批量下载或传播，否则可能导致学校 IP 被数据库封禁。</text><text x="948" y="511" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>