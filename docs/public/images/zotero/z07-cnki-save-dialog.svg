dth="12" height="12" fill="#ffffff" rx="2.5" stroke="#d7dce3" stroke-width="1"/><text x="468" y="224" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">课程：文献检索与研究方法</text><rect x="448" y="230" width="12" height="12" fill="#ffffff" rx="2.5" stroke="#d7dce3" stroke-width="1"/><text x="468" y="240" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">毕业论文：加计扣除与企业创新</text><rect x="464" y="246" width="12" height="12" fill="#ffffff" rx="2.5" stroke="#d7dce3" stroke-width="1"/><text x="484" y="256" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">　01 政策与背景</text><rect x="464" y="262" width="12" height="12" fill="#1677ff" rx="2.5" stroke="#1677ff" stroke-width="1"/><path d="M 467.0 268.2 l 2.6 2.9 l 4.1 -5.0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><text x="484" y="272" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">　02 理论与机制</text><rect x="464" y="278" width="12" height="12" fill="#ffffff" rx="2.5" stroke="#d7dce3" stroke-width="1"/><text x="484" y="288" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">　03 实证与数据方法</text><rect x="464" y="294" width="12" height="12" fill="#ffffff" rx="2.5" stroke="#d7dce3" stroke-width="1"/><text x="484" y="304" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">　04 国外经验与比较</text><text x="418" y="338" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">勾选多个分类时，条目会同时出现在这些分类里（不产生副本）</text><rect x="700" y="352" width="76" height="26" fill="#1677ff" rx="5"/><text x="738" y="370" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">完成</text><rect x="786" y="352" width="76" height="26" fill="#ffffff" rx="5" stroke="#d7dce3" stroke-width="1"/><text x="824" y="370" font-size="12" fill="#5b6470" font-weight="400" text-anchor="middle">取消</text><circle cx="390" cy="151" r="11" fill="#fa8c16"/><text x="390" y="155.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="390" cy="232" r="11" fill="#fa8c16"/><text x="390" y="236.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><circle cx="390" cy="356" r="11" fill="#fa8c16"/><text x="390" y="360.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="60" y="350" width="300" height="81" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="72" y="373" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">① 弹出窗口标题为“选择分类”</text><text x="72" y="392" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">② 勾选保存目标分类，可多选</text><text x="72" y="411" font-size="11" fill="#5b6470" font-weight="400" text-anchor="start">③ 点“完成”后回到 Zotero 查看条目</text><text x="928" y="451" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>