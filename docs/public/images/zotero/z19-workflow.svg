137" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">核对</text><text x="408" y="168" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">校对字段</text><text x="408" y="186" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">修正条目类型</text><line x1="408" y1="206" x2="486" y2="206" stroke="#e8ecf1" stroke-width="1"/><text x="408" y="226" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 字段完整</text><text x="408" y="246" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 类型正确</text><line x1="502" y1="190" x2="516" y2="190" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 516.0 190.0 L 507.0 185.4 L 507.0 194.6 Z" fill="#c3c9d1"/><rect x="516" y="100" width="106" height="178" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="516" y="100" width="106" height="6" fill="#fa8c16" rx="3"/><circle cx="538" cy="132" r="13" fill="#fa8c16"/><text x="538" y="137" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="562" y="137" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">归档</text><text x="530" y="168" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">挂接 PDF</text><text x="530" y="186" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">归入分类加标签</text><line x1="530" y1="206" x2="608" y2="206" stroke="#e8ecf1" stroke-width="1"/><text x="530" y="226" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 分类</text><text x="530" y="246" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 标签</text><line x1="624" y1="190" x2="638" y2="190" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 638.0 190.0 L 629.0 185.4 L 629.0 194.6 Z" fill="#c3c9d1"/><rect x="638" y="100" width="106" height="178" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="638" y="100" width="106" height="6" fill="#fa8c16" rx="3"/><circle cx="660" cy="132" r="13" fill="#fa8c16"/><text x="660" y="137" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="684" y="137" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">阅读批注</text><text x="652" y="168" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">高亮 / 便签</text><text x="652" y="186" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">三层结构笔记</text><line x1="652" y1="206" x2="730" y2="206" stroke="#e8ecf1" stroke-width="1"/><text x="652" y="226" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 批注</text><text x="652" y="246" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 笔记</text><line x1="746" y1="190" x2="760" y2="190" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 760.0 190.0 L 751.0 185.4 L 751.0 194.6 Z" fill="#c3c9d1"/><rect x="760" y="100" width="106" height="178" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="760" y="100" width="106" height="6" fill="#16a34a" rx="3"/><circle cx="782" cy="132" r="13" fill="#16a34a"/><text x="782" y="137" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="806" y="137" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">写作引用</text><text x="774" y="168" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">Word 插入引用</text><text x="774" y="186" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">生成文献表</text><line x1="774" y1="206" x2="852" y2="206" stroke="#e8ecf1" stroke-width="1"/><text x="774" y="226" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 文内引用</text><text x="774" y="246" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 参考文献表</text><line x1="868" y1="190" x2="882" y2="190" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 882.0 190.0 L 873.0 185.4 L 873.0 194.6 Z" fill="#c3c9d1"/><rect x="882" y="100" width="106" height="178" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="882" y="100" width="106" height="6" fill="#16a34a" rx="3"/><circle cx="904" cy="132" r="13" fill="#16a34a"/><text x="904" y="137" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">8</text><text x="928" y="137" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">备份</text><text x="896" y="168" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">同步 + 本地导出</text><text x="896" y="186" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">定期恢复演练</text><line x1="896" y1="206" x2="974" y2="206" stroke="#e8ecf1" stroke-width="1"/><text x="896" y="226" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 同步记录</text><text x="896" y="246" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 备份包</text><rect x="28" y="300" width="944" height="66" fill="#fffbe6" rx="8" stroke="#ffe58f" stroke-width="1"/><text x="48" y="326" font-size="11.5" fill="#8a6100" font-weight="400" text-anchor="start">两条最容易断掉的环节：第 4 步“核对”——不校对就引用，错误会被放大到整篇论文；</text><text x="48" y="348" font-size="11.5" fill="#8a6100" font-weight="400" text-anchor="start">第 8 步“备份”——只同步题录没备份附件，换电脑后全文依然会丢。</text><text x="988" y="391" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">概念示意图</text></svg>