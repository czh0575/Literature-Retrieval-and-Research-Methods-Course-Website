<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1000" height="400" fill="#eef1f5"/><text x="28" y="40" font-size="17" fill="#1f2329" font-weight="700" text-anchor="start">从检索到定稿：Zotero 的完整工作流</text><text x="28" y="62" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">八个环节，每一步都留下可检查的产物</text><rect x="28" y="100" width="106" height="178" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="100" width="106" height="6" fill="#1677ff" rx="3"/><circle cx="50" cy="132" r="13" fill="#1677ff"/><text x="50" y="137" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="74" y="137" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">检索</text><text x="42" y="168" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">知网 / 外文库</text><text x="42" y="186" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">三轮检索法</text><line x1="42" y1="206" x2="120" y2="206" stroke="#e8ecf1" stroke-width="1"/><text x="42" y="226" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 检索日志</text><text x="42" y="246" font-size="10" fill="#98a1ab" font-weight="400" text-anchor="start">· 关键词表</text><line x1="136" y1="190" x2="150" y2="190" stroke="#c3c9d1" stroke-width="1.8"/><path d="M 150.0 190.0 L 141.0 185.4 L 141.0 194.6 Z" fill="#c3c9d1"/><rect x="150" y="100" width="106" height="178" fill="#ffffff" rx="10" stroke="#e8ecf1" stroke-width="1"/><rect x="150" y="100" width="106" height="6" fill="#1677ff" rx="3"/><circle cx="172" cy="132" r="13" fill="#1677ff"/><text x="172" y="137" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="196" y="137" font-size="13" fill="#1f2329" font-weight="700" text-anchor="start">导出题录</text><text x="164" y="168" font-size="10.5" fill="#5b6470" 