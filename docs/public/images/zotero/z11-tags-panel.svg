<svg xmlns="http://www.w3.org/2000/svg" width="940" height="562" viewBox="0 0 940 562" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="940" height="562" fill="#eef1f5"/><text x="28" y="34" font-size="16.5" fill="#1f2329" font-weight="700" text-anchor="start">标签体系与标签过滤器</text><text x="28" y="56" font-size="12.5" fill="#98a1ab" font-weight="400" text-anchor="start">标签按用途分三类，控制在十几个以内</text><text x="28" y="102" font-size="12.5" fill="#16a34a" font-weight="700" text-anchor="start">阅读状态</text><rect x="130" y="84" width="42.0" height="24" fill="#16a34a" rx="11"/><text x="151.0" y="99.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">未读</text><rect x="180.0" y="84" width="53.0" height="24" fill="#16a34a" rx="11"/><text x="206.5" y="99.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">阅读中</text><rect x="241.0" y="84" width="42.0" height="24" fill="#16a34a" rx="11"/><text x="262.0" y="99.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">已读</text><rect x="291.0" y="84" width="42.0" height="24" fill="#16a34a" rx="11"/><text x="312.0" y="99.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">重要</text><text x="28" y="146" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="start">文献类型</text><rect x="130" y="128" width="42.0" height="24" fill="#7c3aed" rx="11"/><text x="151.0" y="143.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">综述</text><rect x="180.0" y="128" width="42.0" height="24" fill="#7c3aed" rx="11"/><text x="201.0" y="143.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">理论</text><rect x="230.0" y="128" width="42.0" height="24" fill="#7c3aed" rx="11"/><text x="251.0" y="143.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">实证</text><rect x="280.0" y="128" width="64.0" height="24" fill="#7c3aed" rx="11"/><text x="312.0" y="143.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">政策文件</text><rect x="352.0" y="128" width="64.0" height="24" fill="#7c3aed" rx="11"/><text x="384.0" y="143.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">学位论文</text><text x="28" y="190" font-size="12.5" fill="#1677ff" font-weight="700" text-anchor="start">使用位置</text><rect x="130" y="172" width="42.0" height="24" fill="#1677ff" rx="11"/><text x="151.0" y="187.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">背景</text><rect x="180.0" y="172" width="42.0" height="24" fill="#1677ff" rx="11"/><text x="201.0" y="187.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">机制</text><rect x="230.0" y="172" width="42.0" height="24" fill="#1677ff" rx="11"/><text x="251.0" y="187.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">方法</text><rect x="280.0" y="172" width="42.0" height="24" fill="#1677ff" rx="11"/><text x="301.0" y="187.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">对策</text><rect x="330.0" y="172" width="64.0" height="24" fill="#1677ff" rx="11"/><text x="362.0" y="187.96" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">文献综述</text><line x1="28" y1="220" x2="912" y2="220" stroke="#e8ecf1" stroke-width="1"/><rect x="28" y="236" width="430" height="300" fill="#fafbfd" rx="8" stroke="#d7dce3" stroke-width="1"/><text x="46" y="262" font-size="12" fill="#1f2329" font-weight="700" text-anchor="start">左下角标签过滤器</text><text x="46" y="282" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">按标签名排序 ▾</text><rect x="46" y="298" width="10" height="10" fill="#16a34a" rx="2"/><text x="64" y="308" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">已读</text><text x="170" y="308" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">36 条</text><circle cx="200" cy="303" r="8" fill="#16a34a" opacity="0.18"/><text x="200" y="307" font-size="9" fill="#16a34a" font-weight="400" text-anchor="middle">✓</text><rect x="46" y="320" width="10" height="10" fill="#fa8c16" rx="2"/><text x="64" y="330" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">阅读中</text><text x="170" y="330" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">8 条</text><rect x="46" y="342" width="10" height="10" fill="#98a1ab" rx="2"/><text x="64" y="352" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">未读</text><text x="170" y="352" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">22 条</text><rect x="46" y="364" width="10" height="10" fill="#d93a3a" rx="2"/><text x="64" y="374" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">重要</text><text x="170" y="374" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">6 条</text><rect x="46" y="386" width="10" height="10" fill="#1677ff" rx="2"/><text x="64" y="396" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">实证</text><text x="170" y="396" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">24 条</text><circle cx="200" cy="391" r="8" fill="#1677ff" opacity="0.18"/><text x="200" y="395" font-size="9" fill="#1677ff" font-weight="400" text-anchor="middle">✓</text><rect x="46" y="408" width="10" height="10" fill="#7c3aed" rx="2"/><text x="64" y="418" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">综述</text><text x="170" y="418" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">7 条</text><rect x="46" y="430" width="10" height="10" fill="#16a34a" rx="2"/><text x="64" y="440" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">政策文件</text><text x="170" y="440" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">11 条</text><rect x="46" y="452" width="10" height="10" fill="#fa8c16" rx="2"/><text x="64" y="462" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">机制</text><text x="170" y="462" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">15 条</text><rect x="46" y="474" width="10" height="10" fill="#1677ff" rx="2"/><text x="64" y="484" font-size="11.5" fill="#5b6470" font-weight="400" text-anchor="start">方法</text><text x="170" y="484" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">13 条</text><text x="46" y="522" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">点击标签即筛选；再点一次取消</text><text x="46" y="540" font-size="10.5" fill="#98a1ab" font-weight="400" text-anchor="start">按住 Ctrl 可多选标签（交集筛选）</text><rect x="478" y="236" width="434" height="300" fill="#ffffff" rx="8" stroke="#e8ecf1" stroke-width="1"/><text x="498" y="262" font-size="12.5" fill="#1f2329" font-weight="700" text-anchor="start">标签的四个操作入口</text><rect x="498" y="288" width="394" height="52" fill="#f5f7fa" rx="6"/><text x="512" y="310" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">在右栏“标签”页添加</text><text x="512" y="328" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">选中条目 → 右栏标签页 → 添加 → 输入标签名</text><rect x="498" y="348" width="394" height="52" fill="#f5f7fa" rx="6"/><text x="512" y="370" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">拖到左下角标签上</text><text x="512" y="388" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">把条目拖到某个标签名上，直接加上该标签</text><rect x="498" y="408" width="394" height="52" fill="#f5f7fa" rx="6"/><text x="512" y="430" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">右键标签 → 分配颜色</text><text x="512" y="448" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">给常用标签配色，筛选时更容易识别</text><rect x="498" y="468" width="394" height="52" fill="#f5f7fa" rx="6"/><text x="512" y="490" font-size="11.5" fill="#1f2329" font-weight="700" text-anchor="start">重命名 / 删除标签</text><text x="512" y="508" font-size="10.5" fill="#5b6470" font-weight="400" text-anchor="start">右键标签选择重命名或删除；删除不会删条目</text><text x="928" y="553" font-size="9.5" fill="#c3c9d1" font-weight="400" text-anchor="end">界面示意图（按真实布局重绘）</text></svg>