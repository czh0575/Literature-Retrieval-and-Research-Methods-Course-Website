<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="siteLogoTitle">
  <title id="siteLogoTitle">文献检索与研究方法</title>

  <defs>
    <linearGradient id="tileBg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#0d47b8"/>
      <stop offset="0.52" stop-color="#1a6bec"/>
      <stop offset="1" stop-color="#4b9bff"/>
    </linearGradient>

    <radialGradient id="lensGlass" cx="0.34" cy="0.28" r="0.86">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#9cc4ff" stop-opacity="0.22"/>
    </radialGradient>

    <clipPath id="tileClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>

    <filter id="markShadow" x="-35%" y="-35%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feOffset in="blur" dx="0" dy="11" result="offsetBlur"/>
      <feFlood flood-color="#06276b" flood-opacity="0.40" result="flood"/>
      <feComposite in="flood" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#tileBg)"/>

  <g clip-path="url(#tileClip)">
    <circle cx="64" cy="44" r="164" fill="#ffffff" opacity="0.075"/>
    <circle cx="492" cy="478" r="188" fill="#ffffff" opacity="0.06"/>
    <circle cx="446" cy="62" r="78" fill="#ffffff" opacity="0.05"/>
  </g>

  <g filter="url(#markShadow)">
    <line x1="324" y1="324" x2="390" y2="390" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
    <circle cx="238" cy="238" r="112" fill="url(#lensGlass)" stroke="#ffffff" stroke-width="32"/>
  </g>

  <g fill="#ffffff">
    <rect x="184" y="182" width="80" height="16" rx="8"/>
    <rect x="184" y="212" width="112" height="16" rx="8"/>
    <rect x="184" y="242" width="64" height="16" rx="8"/>
    <rect x="184" y="272" width="94" height="16" rx="8"/>
  </g>
</svg>
